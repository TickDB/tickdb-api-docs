  /v1/market/depth:
    get:
      summary: Order Book
      description: |
        Get real-time order book bids and asks, including China and Hong Kong futures.
        Typical levels per side: US stocks 1, HK stocks 10, A-shares 5, China futures 1, Hong Kong futures 10, and crypto 20.
        The actual number of levels may be lower when the market is closed, liquidity is limited, or some levels have no quotes.
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading symbol
          schema:
            type: string
            default: "700.HK"
            example: "700.HK"
        - name: type
          in: query
          required: false
          description: Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an AMBIGUOUS_SYMBOL error, pass the value as indicated
          schema:
            type: string
            enum: ["stock", "indices", "crypto", "forex", "futures"]
            example: "stock"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: "700.HK"
                      type:
                        type: string
                        enum: ["stock", "indices", "crypto", "forex", "futures"]
                      timestamp:
                        type: integer
                        example: 1768274016162
                      bids:
                        type: array
                        description: Buy orders sorted by price descending
                        items:
                          type: array
                          items:
                            type: string
                        example: [["626", "19700"], ["625.5", "40800"]]
                      asks:
                        type: array
                        description: Sell orders sorted by price ascending
                        items:
                          type: array
                          items:
                            type: string
                        example: [["626.5", "36100"], ["627", "50700"]]
  /v1/market/trades:
    get:
      summary: Tick-by-Tick Trades
      description: Get tick-by-tick trade prints for a symbol, including A-shares, China futures, and Hong Kong futures.
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading symbol
          schema:
            type: string
            default: "700.HK"
            example: "700.HK"
        - name: limit
          in: query
          required: false
          description: Number of trades (default 100, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            example: 100
        - name: type
          in: query
          required: false
          description: Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an AMBIGUOUS_SYMBOL error, pass the value as indicated
          schema:
            type: string
            enum: ["stock", "indices", "crypto", "forex", "futures"]
            example: "stock"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: "BU2609"
                      type:
                        type: string
                        enum: ["stock", "indices", "crypto", "forex", "futures"]
                        example: "futures"
                      trades:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "1703123456789_0"
                            price:
                              type: string
                              example: "4315.00"
                            quantity:
                              type: string
                              example: "2"
                            side:
                              type: string
                              enum: ["buy", "sell", "neutral"]
                              example: "sell"
                            timestamp:
                              type: integer
                              example: 1703123456789
                            open_interest_change:
                              type: [integer, "null"]
                              description: Change in open interest caused by this trade; futures only
                              example: 0
                            position_effect:
                              type: string
                              description: Effect of the trade on positions; futures only
                              enum: ["long_open", "short_open", "both_open", "long_close", "short_close", "both_close", "long_transfer", "short_transfer"]
                              example: "short_transfer"
