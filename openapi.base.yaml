  /v1/market/kline/latest:
    get:
      summary: Latest Candlesticks
      description: Get the latest candlestick data for one or more symbols
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols, up to 50 (e.g., AAPL.US,00700.HK)
          schema:
            type: string
            default: "AAPL.US,00700.HK"
            example: "AAPL.US,00700.HK"
        - name: interval
          in: query
          required: true
          description: K-line interval
          schema:
            type: string
            enum: ["1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "1d", "1w", "1M"]
            default: "3m"
            example: "3m"
        - name: type
          in: query
          required: false
          description: Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an AMBIGUOUS_SYMBOL error, pass the value as indicated
          schema:
            type: string
            enum: ["stock", "indices", "crypto", "forex", "futures"]
            example: "stock"
        - name: adjust
          in: query
          required: false
          description: Price adjustment mode for A-shares, HK stocks, and US stocks. If omitted, prices are unadjusted (none).
          schema:
            type: string
            enum: ["none", "forward", "backward"]
            default: "none"
            example: "forward"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        type:
                          type: string
                          enum: ["stock", "indices", "crypto", "forex", "futures"]
                        interval:
                          type: string
                        adjust:
                          type: string
                          enum: ["none", "forward", "backward"]
                          description: Applied price adjustment mode
                          example: "none"
                        klines:
                          type: array
                          items:
                            type: object
                            properties:
                              time:
                                type: integer
                              open:
                                type: string
                              high:
                                type: string
                              low:
                                type: string
                              close:
                                type: string
                              volume:
                                type: string
                              quote_volume:
                                type: string
                                description: Trading amount; normally omitted for futures
                              open_interest:
                                type: string
                                description: Open interest; returned for futures
                    example:
                      - symbol: "AAPL.US"
                        interval: "3m"
                        adjust: "none"
                        klines:
                          - time: 1773259020000
                            open: "260.86"
                            high: "261.05"
                            low: "260.7"
                            close: "260.81"
                            volume: "963419"
                            quote_volume: "251311057.55"
                      - symbol: "00700.HK"
                        interval: "3m"
                        adjust: "none"
                        klines:
                          - time: 1773293400000
                            open: "542.5"
                            high: "544.5"
                            low: "542"
                            close: "544.5"
                            volume: "80300"
                            quote_volume: "43656433.33"
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Invalid parameters"
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: "Unauthorized"
  /v1/market/kline/ex-factors:
    get:
      summary: Adjustment Factors
      description: Get forward and backward price adjustment factors for A-shares, HK stocks, and US stocks
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated stock symbols
          schema:
            type: string
            default: "600519.SH"
            example: "600519.SH,700.HK,AAPL.US"
        - name: type
          in: query
          required: false
          description: Product type. Only stock is supported; omit it when the symbol is unambiguous
          schema:
            type: string
            enum: ["stock"]
            example: "stock"
        - name: start_time
          in: query
          required: false
          description: Inclusive start timestamp in milliseconds
          schema:
            type: integer
            format: int64
        - name: end_time
          in: query
          required: false
          description: Inclusive end timestamp in milliseconds
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: Adjustment factors grouped by stock symbol
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            required: [timestamp, adjust, factor_a, factor_b]
                            properties:
                              timestamp:
                                type: integer
                                format: int64
                                description: Factor effective timestamp in milliseconds
                              adjust:
                                type: string
                                enum: ["forward", "backward"]
                                description: Adjustment direction
                              factor_a:
                                type: number
                                description: Multiplicative factor in the adjustment formula
                              factor_b:
                                type: number
                                description: Additive factor in the adjustment formula
        '400':
          description: Missing, invalid, ambiguous, or conflicting query parameters
        '503':
          description: Adjustment factors are temporarily unavailable
