  /v1/market/trade-days:
    get:
      summary: Trading Days
      description: Get trading days for a specific market within a date range
      parameters:
        - name: market
          in: query
          required: true
          description: Market code (US, HK, CN)
          schema:
            type: string
            enum: ["US", "HK", "CN"]
            default: "US"
            example: "US"
        - name: beg_day
          in: query
          required: true
          description: Start date in YYYYMMDD format. Must be within the most recent year
          schema:
            type: string
            pattern: "^[0-9]{8}$"
            default: "20260201"
            example: "20260201"
        - name: end_day
          in: query
          required: true
          description: End date in YYYYMMDD format. The requested date range cannot exceed 31 days
          schema:
            type: string
            pattern: "^[0-9]{8}$"
            default: "20260228"
            example: "20260228"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    const: 0
                    example: 0
                  data:
                    type: object
                    required: [market, trade_days, half_trade_days]
                    additionalProperties: false
                    properties:
                      market:
                        type: string
                        enum: ["US", "HK", "CN"]
                      trade_days:
                        type: array
                        items:
                          type: string
                      half_trade_days:
                        type: array
                        items:
                          type: string
                    example:
                      market: "US"
                      trade_days: ["20260202", "20260203", "20260204", "20260205", "20260206", "20260209", "20260210", "20260211", "20260212", "20260213", "20260217", "20260218", "20260219", "20260220", "20260223", "20260224", "20260225", "20260226", "20260227"]
