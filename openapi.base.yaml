# Canonical API contract. Edit structural changes here, then run `npm run openapi:localize`.
# The generated openapi.yaml, openapi.zh-Hant.yaml and openapi.en.yaml power localized Try it pages.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: TickDB API
  description: Unified real-time market data API — one connection for Forex, indices,
    US stocks, HK stocks, A-shares, China futures, and Crypto via REST and WebSocket.
  version: 1.0.3
  contact:
    email: support@tickdb.ai
servers:
  - url: https://api.tickdb.ai
    description: Production server
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema:
        type: string
        examples: [AAPL, "700", "600519", AAPL.US, 700.HK, 600519.SH]
      description: 股票代码。
    TypeQuery:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [stock]
      description: 股票类型消歧参数。
    RequiredMarketQuery:
      name: market
      in: query
      required: true
      schema:
        type: string
        enum: [US, HK, CN]
      description: 市场代码：US（美股）、HK（港股）、CN（A股）；不区分大小写，文档统一使用大写形式。
    FromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        examples: ["2024-01-01"]
      description: 起始日期，闭区间，格式 `YYYY-MM-DD`。
    ToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        examples: ["2026-12-31"]
      description: 结束日期，闭区间，格式 `YYYY-MM-DD`。
    DividendTypeQuery:
      name: dividend_type
      in: query
      required: false
      schema:
        type: string
        enum: [normal, special, non_cash, unknown]
      description: 分红分类筛选。
    DividendLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: 单页分红记录数。
    DividendAsOfQuery:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: TTM 统计截止日，默认当前日期。
    KindQuery:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum: [IS, BS, CF]
      description: 报表类型，IS=利润表，BS=资产负债表，CF=现金流量表；一次请求只接受一个值。
    TTMKindQuery:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum: [IS, CF]
      description: TTM 只对 IS（利润表）和 CF（现金流量表）定义；BS（资产负债表）会返回参数错误。
    PeriodTypeQuery:
      name: period_type
      in: query
      required: false
      schema:
        type: string
        default: "q1,q2,q3,q4"
        pattern: "^(q1|q2|q3|q4|saf|af)(,(q1|q2|q3|q4|saf|af))*$"
        examples: [q1, saf, af, "q1,q2,q3,q4"]
      description: 财务周期类型，可用逗号分隔多个值。`q1` 第一季度、`q2` 第二季度、`q3` 第三季度、`q4` 第四季度、`saf` 半年度、`af` 年度；不支持 `qf`。
    NQuery:
      name: n
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
      description: 返回期数。
    SegmentLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
      description: 历史分部返回条数上限。
    IndustryRankLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: 行业指标排行返回条数上限。
    FundHoldingsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      description: 单页持股基金记录数上限。
    NewsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: 新闻返回条数上限。
    NewsIDPath:
      name: news_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
      description: 新闻列表返回的不透明文章 ID，按字符串传递。
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: 分页游标。第一页不传；后续请求将上一页响应顶层的 `page.next_cursor` 非空值原样传入，并保持其他查询参数不变。
    SegmentCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum: [business, regional]
      description: 营收构成维度，business=按业务，regional=按地区；不传时返回全部可用维度。
    ReportQuery:
      name: report
      in: query
      required: false
      schema:
        type: string
        examples: [qf, saf, af]
      description: 按报告周期筛选，例如 `qf` 季度报告、`saf` 半年度报告、`af` 年度报告；当前不限制为固定取值。
    GranularityQuery:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [daily, monthly]
        default: daily
      description: 历史估值记录的时间粒度，可选 daily（日度）或 monthly（月度）。
    ValuationFromQuery:
      name: from
      in: query
      required: false
      schema: { type: string, format: date }
      description: 查询起始日期，格式 `YYYY-MM-DD`。不传日期范围时，日度默认最近一年、月度默认最近五年。
    ValuationToQuery:
      name: to
      in: query
      required: false
      schema: { type: string, format: date }
      description: 查询结束日期，格式 `YYYY-MM-DD`。不传日期范围时，默认到当前 UTC 日期。
    IndustryCounterIDQuery:
      name: industry_counter_id
      in: query
      required: true
      schema:
        type: string
      description: 行业 ID，来自 `/fundamentals/industries/rank` 响应。
    ObjectIDQuery:
      name: object_id
      in: query
      required: true
      schema:
        type: string
      description: 股东对象 ID，来自 `/fundamentals/shareholders/top?symbol={symbol}` 响应成员。
    CalendarOtherCategoryQuery:
      name: category
      in: query
      required: true
      schema:
        type: string
        enum: [macrodata, closed, meeting, merge, halt_resume, special_treatment, special_treatment_start, special_treatment_end, listing_status, listing_suspension, listing_resumption, delisting, lockup_expiry]
      description: 其他日历事件类别，每次选择一种；不接受 report、dividend、split 或 ipo。
    CalendarMarketQuery:
      name: market
      in: query
      required: false
      schema:
        type: string
        enum: [US, HK, CN]
      description: 市场过滤。API Key 有 fundamentals 市场限制时必填，且必须在允许列表内。
    FullMarketCompressionHeader:
      name: Accept-Encoding
      in: header
      required: true
      description: 全量行情响应必须启用压缩，支持 gzip、br 和 zstd，至少选择一种；默认使用兼容性较好的 gzip。
      schema:
        type: string
        enum: [gzip, br, zstd]
        default: gzip
    CalendarFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 起始日期，闭区间，格式 `YYYY-MM-DD`；省略时默认为当前 UTC 日期。
    CalendarToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 结束日期，闭区间，格式 `YYYY-MM-DD`；省略时默认为 `from` 后 7 天。
    CalendarSymbolsQuery:
      name: symbols
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        examples: [AAPL.US, "AAPL.US,700.HK,600519.SH"]
      description: 股票代码，多个代码使用英文逗号分隔，最多 50 个；与 market、category 条件同时生效。
    CalendarLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: 每页返回的事件数量，范围 1–500。
  responses:
    APIKeyStatusResponse:
      description: 当前账户名下 API Key 的状态和到期信息。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIKeyStatusEnvelope" }
    ProfileResponse:
      description: 公司资料响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProfileEnvelope" }
    ExecutivesResponse:
      description: 当前高管/董事列表响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExecutivesEnvelope" }
    FinancialRowsResponse:
      description: 财务数据行响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinancialRowsEnvelope" }
    SegmentsResponse:
      description: 业务/地区分部响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SegmentsEnvelope" }
    SegmentsLatestResponse:
      description: 最近一期业务/地区营收构成响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SegmentsLatestEnvelope" }
    ValuationLatestResponse:
      description: 当前估值快照响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValuationLatestEnvelope" }
    ValuationTimeSeriesResponse:
      description: 历史估值响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValuationTimeSeriesEnvelope" }
    IndustryPeersResponse:
      description: 同行估值对比响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IndustryPeersEnvelope" }
    IndustryDistributionResponse:
      description: 行业估值分布响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IndustryDistributionEnvelope" }
    IndustriesRankResponse:
      description: 行业指标排行响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IndustriesRankEnvelope" }
    IndustriesTreeResponse:
      description: 行业分类层级响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IndustriesTreeEnvelope" }
    DividendsResponse:
      description: 分红记录响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DividendsEnvelope" }
    DividendsTTMResponse:
      description: 按币种拆分的近十二个月现金 DPS 响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DividendsTTMEnvelope" }
    BuybackResponse:
      description: 回购事件响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BuybackEnvelope" }
    LatestShareholdersResponse:
      description: 最新股东结构响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LatestShareholdersEnvelope" }
    TopShareholdersResponse:
      description: 股东持仓响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TopShareholdersEnvelope" }
    ShareholderDetailResponse:
      description: 单个股东持仓明细响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ShareholderDetailEnvelope" }
    FundHoldingsResponse:
      description: 持股基金响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FundHoldingsEnvelope" }
    CorporateActionsResponse:
      description: 公司行动响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CorporateActionsEnvelope" }
    NewsResponse:
      description: 新闻资讯响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NewsEnvelope" }
    NewsDetailResponse:
      description: 新闻正文详情响应；pending、blocked 和 failed 均为正常业务状态。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NewsDetailEnvelope" }
    NewsErrorResponse:
      description: 资讯接口错误响应，包含错误代码和说明。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NewsErrorEnvelope" }
    CalendarResponse:
      description: 财经日历响应。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CalendarEnvelope" }
    ErrorResponse:
      description: |
        错误响应。常见 HTTP 状态包括 400（参数错误）、401（鉴权失败）、403（接口、市场或配额限制）、
        404（交易产品或业务数据不存在）、429（请求频率超限）和 503（数据暂不可用）。
        `code` 可能是整数或字符串；响应至少包含 `code` 和 `message`，并可能包含 `error` 或 `data`。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            missingAPIKey:
              summary: 缺少 API Key
              value: { code: "1002", message: "API key is required. Provide via X-API-Key header", error: "1002" }
            missingKind:
              summary: 缺少必填参数
              value: { code: 40001, message: "kind is required", data: null }
            endpointForbidden:
              summary: API Key 无权访问该接口
              value: { code: 3009, message: "This endpoint is not allowed for your API key", data: null }
            marketForbidden:
              summary: API Key 未开放该市场
              value: { code: 3010, message: "Fundamentals market not allowed for your API key", data: { market: US } }
            noAvailableSource:
              summary: 数据暂不可用
              value: { code: 5003, message: "Data is temporarily unavailable", data: null }
            notFound:
              summary: 无匹配数据
              value: { code: 40404, message: "shareholder detail not found", data: null }
            businessNoData:
              summary: 查询条件无有效业务数据
              value: { code: 40405, message: "valuation time series not found", data: null }
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          const: 0
          description: 业务状态码，成功为 0。
    APIKeyStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            message: { type: string, description: 请求结果说明。 }
            data: { $ref: "#/components/schemas/APIKeyStatusData" }
    APIKeyStatusData:
      type: object
      required: [server_time, total, api_keys]
      properties:
        server_time: { type: string, format: date-time, description: 本次查询的服务器时间。 }
        total: { type: integer, minimum: 0, description: 返回的 API Key 数量。 }
        api_keys:
          type: array
          description: 当前账户名下的 API Key 列表。
          items: { $ref: "#/components/schemas/APIKeyStatusItem" }
      additionalProperties: false
    APIKeyStatusItem:
      type: object
      required: [key_prefix, name, plan, status, expires_at, remaining_seconds, created_at]
      properties:
        key_prefix: { type: string, description: 用于辨认 Key 的前缀，不是完整密钥。 }
        name: { type: string, description: API Key 名称。 }
        plan: { type: string, description: 套餐标识。 }
        status:
          type: string
          enum: [active, expired, suspended, revoked]
          description: API Key 状态。
        expires_at: { type: [string, "null"], format: date-time, description: 到期时间；未设置时为 null。 }
        remaining_seconds: { type: [integer, "null"], minimum: 0, description: 剩余秒数；已到期为 0，未设置到期时间时为 null。 }
        created_at: { type: string, format: date-time, description: API Key 创建时间。 }
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          description: TickDB API 业务错误码；可能为整数或字符串，客户端应归一化为字符串后比较。
          oneOf:
            - type: integer
            - type: string
        message: { type: string, description: 错误说明。 }
        error: { type: string, description: 兼容错误标识；仅部分错误响应返回。 }
        data:
          description: 可选的错误上下文；可能为 null、对象或数组。
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: true
            - type: array
              items: {}
    ProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProfileData" }
    ProfileData:
      type: object
      description: 公司资料数据。
      required: [symbol, market, name]
      properties:
        symbol: { type: string, description: 标准化股票代码，例如 AAPL.US、700.HK、600519.SH。 }
        name: { type: string, description: 公司名称。 }
        company_name: { type: string, description: 公司法定或英文名称。 }
        market: { type: string, description: 市场代码。 }
        region: { type: string, description: 国家或地区代码。 }
        founded: { type: [string, "null"], description: 成立年份或日期；无数据时为 null。 }
        listing_date: { type: [string, "null"], format: date, description: 上市日期；无数据时为 null。 }
        year_end: { type: [string, "null"], description: 财年结束信息。 }
        address: { type: string, description: 地址。 }
        office_address: { type: string, description: 办公地址。 }
        phone: { type: string, description: 联系电话。 }
        email: { type: string, description: 电子邮箱。 }
        website: { type: string, description: 公司网站；返回值可能不带 URL 协议前缀。 }
        employees: { type: integer, description: 员工数。 }
        chairman: { type: string, description: 董事长。 }
        manager: { type: string, description: 主要管理人员。 }
        secretary: { type: string, description: 公司秘书。 }
        legal_repr: { type: string, description: 法定代表人。 }
        accounting_firm: { type: string, description: 会计师事务所。 }
        legal_counsel: { type: string, description: 法律顾问。 }
        category: { type: string, description: 公司类别。 }
        profile: { type: string, description: 公司业务简介。 }
      additionalProperties: false
    ExecutivesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ExecutivesData" }
    ExecutivesData:
      type: object
      description: 高管/董事数据。
      required: [symbol, total, members]
      properties:
        symbol: { type: string, description: 规范化后的标的代码。 }
        total: { type: integer, minimum: 0, description: 成员总数。 }
        members:
          type: array
          description: 高管/董事成员列表。
          items: { $ref: "#/components/schemas/Executive" }
      additionalProperties: true
    Executive:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 姓名。 }
        title: { type: string, description: 职务。 }
        biography: { type: string, description: 简历。 }
      additionalProperties: true
    FinancialRowsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/FinancialRowsData" }
    FinancialRowsData:
      type: object
      description: 财务报表数据。实测数值字段会以字符串返回以避免 JSON 浮点精度问题。
      required: [symbol, kind, rows]
      properties:
        symbol: { type: string, description: 标准化股票代码。 }
        kind: { type: string, enum: [IS, BS, CF], description: 报表类型：IS 利润表、BS 资产负债表、CF 现金流量表。 }
        rows:
          type: array
          description: 所选报表类型的指标记录列表；同一报告期通常包含多条记录。
          items: { $ref: "#/components/schemas/FinancialRow" }
      additionalProperties: true
    FinancialRow:
      type: object
      required: [kind, period_type, fiscal_year, fiscal_period, period_end, field_name, indicator_title, value]
      properties:
        kind: { type: string, enum: [IS, BS, CF], description: 报表类型：IS 利润表、BS 资产负债表、CF 现金流量表。 }
        field_name: { type: string, description: 财务指标字段代码，取值见对应财务报表页面的财务字段字典。 }
        indicator_title: { type: string, description: 指标标题。 }
        field_display: { type: string, description: 带单位的展示名称。 }
        value:
          oneOf: [{ type: string }, { type: number }, { type: "null" }]
          description: 字段值。
        fiscal_year: { type: integer, description: 财年。 }
        fiscal_period: { type: string, description: 财务周期。 }
        period_type: { type: string, description: 财务周期类型，常见值包括 q1（第一季度）、q2（第二季度）、q3（第三季度）、q4（第四季度）、saf（半年度）、af（年度）、ttm（滚动近12个月）。 }
        period_end: { type: string, format: date, description: 报告期结束日期。 }
        currency: { type: [string, "null"], description: 币种。 }
        is_percent: { type: boolean, description: 是否为百分比指标。 }
        yoy: { type: [string, number, "null"], description: 同比值。 }
        ratio: { type: [string, number, "null"], description: 比率值。 }
      additionalProperties: true
    SegmentsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SegmentsData" }
    SegmentsLatestEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SegmentsLatestData" }
    SegmentsLatestData:
      type: object
      description: 最近一期营收构成数据。
      required: [symbol, segments]
      properties:
