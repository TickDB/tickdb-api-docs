      properties:
        filing_date: { type: string, description: 申报日期。 }
        name: { type: string, description: 股东名称。 }
        object_id: { type: string, description: 股东对象 ID。 }
        percent_shares_changed: { type: string, description: 持股比例变化，包含百分号。 }
        percent_shares_held: { type: string, description: 持股比例，包含百分号。 }
        period: { type: string, description: 报告期。 }
        shares_changed: { type: string, description: 股份变动数量。 }
        shares_held: { type: string, description: 持股数量。 }
      additionalProperties: false
    ShareholderTradingSummary:
      type: object
      required: [accum_buy, accum_sell, net_buy, period, trading_details]
      properties:
        accum_buy: { type: string, description: 该期间累计买入数量。 }
        accum_sell: { type: string, description: 该期间累计卖出数量。 }
        net_buy: { type: string, description: 该期间净买入数量。 }
        period: { type: string, description: 交易统计期间。 }
        trading_details:
          type: array
          description: 该期间的交易明细列表。
          items: { type: object, additionalProperties: true }
      additionalProperties: false
    FundHoldingsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [page]
          properties:
            data: { $ref: "#/components/schemas/FundHoldingsData" }
            page: { $ref: "#/components/schemas/PageInfo" }
    PageInfo:
      type: object
      required: [next_cursor, limit]
      properties:
        next_cursor: { type: [string, "null"], description: 下一页游标；非空时原样作为下一次请求的 cursor 参数，末页为 null。 }
        limit: { type: integer, minimum: 1, description: 当前分页上限。 }
      additionalProperties: true
    FundHoldingsData:
      type: object
      required: [symbol, total, members]
      properties:
        symbol: { type: string, description: 标准化股票代码。 }
        total: { type: integer, description: 持有该股票的基金记录总数。 }
        members:
          type: array
          description: 披露持有该股票的基金列表。
          items: { $ref: "#/components/schemas/FundHoldingMember" }
      additionalProperties: true
    FundHoldingMember:
      type: object
      required: [fund_code, fund_symbol, fund_name, currency, position_ratio, report_date]
      properties:
        fund_code: { type: string, description: 基金代码。 }
        fund_symbol: { type: string, description: 基金代码。 }
        fund_name: { type: string, description: 基金名称。 }
        currency: { type: string, description: 币种。 }
        position_ratio: { type: [string, number, "null"], description: 该股票在对应基金持仓中的比例。 }
        report_date: { type: string, format: date, description: 基金持有该股票的信息披露日期。 }
      additionalProperties: true
    NewsEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/NewsData" }
      additionalProperties: false
    NewsData:
      type: object
      required: [symbol, limit, news]
      properties:
        symbol: { type: string, description: 标准化股票代码。 }
        limit: { type: integer, description: 返回条数上限。 }
        news:
          type: array
          description: 新闻列表。
          items: { $ref: "#/components/schemas/NewsItem" }
      additionalProperties: false
    NewsItem:
      type: object
      required: [news_id, title, description, published_at, has_body]
      properties:
        news_id: { type: string, pattern: "^[1-9][0-9]*$", description: 不透明新闻 ID。 }
        title: { type: string, description: 新闻标题；个别记录可能为空字符串。 }
        description: { type: ["string", "null"], description: 摘要。 }
        published_at: { type: string, format: date-time, description: 发布时间。 }
        has_body: { type: boolean, description: 当前是否存在可展示正文。 }
      additionalProperties: false
    NewsDetailEnvelope:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: "#/components/schemas/NewsDetailItem" }
      additionalProperties: false
    NewsDetailItem:
      type: object
      required: [news_id, title, description, published_at, detail_status, content_scope, body_text, body_html]
      properties:
        news_id: { type: string, pattern: "^[1-9][0-9]*$", description: 不透明新闻 ID。 }
        title: { type: string, description: 新闻标题。 }
        description: { type: ["string", "null"], description: 列表摘要。 }
        published_at: { type: string, format: date-time, description: 发布时间。 }
        detail_status:
          type: string
          enum: [pending, succeeded, blocked, failed]
        content_scope:
          type: string
          enum: [full, excerpt, unknown, none]
        body_text: { type: [string, "null"], description: 规范化 UTF-8 正文纯文本。 }
        body_html: { type: [string, "null"], description: 白名单消毒后的语义 HTML。 }
      additionalProperties: false
    NewsErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          description: TickDB API 业务错误码；可能为整数或字符串。
          oneOf:
            - type: integer
            - type: string
        message: { type: string, description: 面向调用方的错误说明。 }
        error: { type: string, description: 兼容错误标识；仅部分错误响应返回。 }
        data:
          description: 可选的错误上下文。
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: true
            - type: array
              items: {}
      additionalProperties: true
    CalendarEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [page]
          properties:
            data: { $ref: "#/components/schemas/CalendarData" }
            page: { $ref: "#/components/schemas/CalendarPage" }
    CalendarPage:
      type: object
      required: [next_cursor, limit]
      properties:
        next_cursor: { type: [string, "null"], description: 下一页游标；末页为 null。 }
        limit: { type: integer, minimum: 1, maximum: 500, description: 当前分页上限。 }
      additionalProperties: false
    CalendarData:
      type: object
      required: [from, to, events]
      properties:
        from: { type: string, format: date, description: 查询起始日期，闭区间。 }
        to: { type: string, format: date, description: 查询结束日期，闭区间。 }
        events:
          type: array
          description: 按 event_datetime 升序排列的财经事件，最多 500 条。
          maxItems: 500
          items: { $ref: "#/components/schemas/FullCalendarEvent" }
      additionalProperties: false
    FullCalendarEvent:
      type: object
      required: [category, content, counter_name, currency, date_type, event_datetime, event_type, market, star, symbol]
      properties:
        category:
          type: string
          description: 事件细分类别，例如 ipo_offering、ipo_listing；请求参数 category 使用上层筛选类别。
        event_datetime: { type: string, format: date-time, description: 事件时间，UTC RFC3339。 }
        symbol: { type: string, description: 标准化股票代码；全局事件可为空字符串。 }
        market: { type: string, enum: [US, HK, CN], description: 事件所属市场。 }
        event_type: { type: string, description: 事件类型。 }
        content: { type: string, description: 事件内容。 }
        counter_name: { type: [string, "null"], description: 相关标的名称。 }
        date_type: { type: [string, "null"], description: 日期类型。 }
        star: { type: integer, description: 事件重要性。 }
        currency: { type: [string, "null"], description: 币种。 }
        issue_price: { type: [string, "null"], description: IPO 发行价格；仅 IPO 事件返回，无可用价格时为 null。 }
        data:
          type: array
          description: 事件附加数据；没有附加数据时省略。
          items: { $ref: "#/components/schemas/CalendarEventData" }
      additionalProperties: false
    CalendarEventData:
      type: object
      required: [key, value_type, value_text, value_raw]
      properties:
        key: { type: string, description: 附加数据键名，部分记录可能为空字符串。 }
        value_type: { type: string, description: 附加数据类型。 }
        value_text: { type: [string, "null"], description: 展示值。 }
        value_raw: { type: [string, "null"], description: 原始值。 }
      additionalProperties: false
    FullMarketTicker:
      type: object
      required: [symbol, last_price, timestamp]
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: 交易产品代码。
        name:
          type: string
          description: 产品名称；名称信息可用时返回。
        type:
          type: string
          enum: [stock, indices]
          description: 产品类型。
        category:
          type: string
          enum: [sh_stock, sz_stock, bj_stock, etf, cn_index, cn_bond]
          description: A股产品细分类别；仅A股全量行情返回。
        last_price:
          type: string
          description: 最新成交价。
        open:
          type: string
          description: 当日开盘价；数据不可用时不返回。
        prev_close:
          type: string
          description: 上一交易日收盘价；数据不可用时不返回。
        volume_24h:
          type: string
          description: 当日累计成交量；数据不可用时不返回。
        quote_volume_24h:
          type: string
          description: 当日累计成交额；数据不可用时不返回。
        high_24h:
          type: string
          description: 当日最高价；数据不可用时不返回。
        low_24h:
          type: string
          description: 当日最低价；数据不可用时不返回。
        price_change_24h:
          type: string
          description: 相对昨收的价格变化；数据不可用时不返回。
        price_change_percent_24h:
          type: string
          description: 相对昨收的价格变化百分比；数据不可用时不返回。
        timestamp:
          type: integer
          format: int64
          description: Unix 时间戳，单位为毫秒。
    FullMarketTickerResponse:
      type: object
      required: [code, message, data]
      additionalProperties: false
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/FullMarketTicker"
x-user-api-scope:
  primary_user_api_count: 25
  authentication: X-API-Key
x-fundamentals-product-scope:
  supported_stock_categories:
    - { market: US, exchanges: [NASDAQ, NYSE, AMEX], category: stock }
    - { market: HK, exchanges: [HKEX], category: stock }
    - { market: CN, exchanges: [SH, SZ], category: stock }
  unsupported_upstream_categories: [US_ARCA, US_BATS, CN_BJ_STOCK, CN_SH_ETF, CN_SZ_ETF]
  unsupported_behavior: 不承诺 fundamentals 数据可用性；当前接口行为包括结构化 404 或格式正确的成功空响应。
paths:
  /v1/apikeys/subscriptions:
    get:
      tags: [account]
      summary: APIKey管理
      description: 无需登录官网，查询账户名下 API Key 的到期时间和剩余秒数，便于定时检查和设置提醒。
      operationId: getAPIKeyStatus
      responses:
        "200": { $ref: "#/components/responses/APIKeyStatusResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/market/ticker:
    get:
      summary: Market Ticker
      description: Get real-time ticker snapshots for one or more symbols
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated symbols (max 50)
          schema:
            type: string
            default: "700.HK,AAPL.US"
            example: "700.HK,AAPL.US"
        - name: type
          in: query
          required: false
          description: Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an AMBIGUOUS_SYMBOL error, pass the value as indicated
          schema:
            type: string
            enum: ["stock", "indices", "crypto", "forex", "futures"]
            example: "stock"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: array
                    items:
                      type: object
                      required: [symbol, last_price, timestamp]
                      additionalProperties: false
                      properties:
                        symbol:
                          type: string
                          description: 标准化交易产品代码。
                        name:
                          type: string
                          description: 产品名称；名称信息可用时返回。
                        type:
                          type: string
                          enum: ["stock", "indices", "crypto", "forex", "futures"]
                          description: 产品类型；产品类型成功识别时返回。
                        category:
                          type: string
                          description: A股产品细分类别，例如 sh_stock、sz_stock、bj_stock、etf、cn_bond、cn_index；仅查询A股市场产品且分类信息可用时返回。
                        last_price:
                          type: string
                          description: 最新成交价。
                        open:
                          type: string
                          description: 开盘价；相应行情统计可用时返回。传统市场通常为当日或当前交易时段开盘价，加密货币按对应行情统计窗口返回。
                        prev_close:
                          type: string
                          description: 昨收或参考价；相应行情统计可用时返回。传统市场通常为上一交易日或上一交易时段收盘价，加密货币按对应行情统计窗口返回。
                        bid_price:
                          type: string
                          description: 最优买价；盘口报价可用时返回。
                        ask_price:
                          type: string
                          description: 最优卖价；盘口报价可用时返回。
                        volume_24h:
                          type: string
                          description: 累计成交量；相应行情统计可用时返回。加密货币通常为滚动24小时成交量，传统市场通常为当日或当前交易时段成交量。
                        quote_volume_24h:
                          type: string
                          description: 与 volume_24h 相同统计窗口的成交额；成交额数据可用时返回。
                        high_24h:
                          type: string
                          description: 最高价；相应行情统计可用时返回。统计窗口与 volume_24h 一致。
                        low_24h:
                          type: string
                          description: 最低价；相应行情统计可用时返回。统计窗口与 volume_24h 一致。
                        price_change_24h:
                          type: string
                          description: 价格变化；相应行情统计可用时返回。统计窗口与 volume_24h 一致。
                        price_change_percent_24h:
                          type: string
                          description: 价格变化百分比；相应行情统计可用时返回，非空数值保留两位小数。
                        timestamp:
                          type: integer
                          format: int64
                          description: Unix 时间戳，单位为毫秒。
                        pre_market_quote:
                          type: object
                          description: 盘前行情；仅支持扩展交易时段的产品（如美股）且盘前行情数据可用时返回。
                          required: [last_done, timestamp, volume, high, low, prev_close]
                          additionalProperties: false
                          properties:
                            last_done: { type: string, description: 盘前最新成交价。 }
                            timestamp: { type: integer, format: int64, description: 盘前行情时间戳，Unix 毫秒（UTC）。 }
                            volume: { type: integer, format: int64, description: 盘前成交量。 }
                            quote_volume: { type: string, description: 盘前成交额；数据可用时返回。 }
                            high: { type: string, description: 盘前最高价。 }
                            low: { type: string, description: 盘前最低价。 }
                            prev_close: { type: string, description: 盘前参考昨收价。 }
                        post_market_quote:
                          type: object
                          description: 盘后行情；仅支持扩展交易时段的产品（如美股）且盘后行情数据可用时返回。
                          required: [last_done, timestamp, volume, high, low, prev_close]
                          additionalProperties: false
                          properties:
                            last_done: { type: string, description: 盘后最新成交价。 }
                            timestamp: { type: integer, format: int64, description: 盘后行情时间戳，Unix 毫秒（UTC）。 }
                            volume: { type: integer, format: int64, description: 盘后成交量。 }
                            quote_volume: { type: string, description: 盘后成交额；数据可用时返回。 }
                            high: { type: string, description: 盘后最高价。 }
                            low: { type: string, description: 盘后最低价。 }
                            prev_close: { type: string, description: 盘后参考昨收价。 }
                        overnight_quote:
                          type: object
                          description: 夜盘行情；仅支持扩展交易时段的产品（如美股）且夜盘行情数据可用时返回。
                          required: [last_done, timestamp, volume, high, low, prev_close]
                          additionalProperties: false
                          properties:
                            last_done: { type: string, description: 夜盘最新成交价。 }
                            timestamp: { type: integer, format: int64, description: 夜盘行情时间戳，Unix 毫秒（UTC）。 }
                            volume: { type: integer, format: int64, description: 夜盘成交量。 }
                            quote_volume: { type: string, description: 夜盘成交额；数据可用时返回。 }
                            high: { type: string, description: 夜盘最高价。 }
                            low: { type: string, description: 夜盘最低价。 }
                            prev_close: { type: string, description: 夜盘参考昨收价。 }
                    example:
                      - symbol: "700.HK"
                        last_price: "543"
                        volume_24h: "11205874"
                        high_24h: "557"
                        low_24h: "543"
                        price_change_24h: "-9"
                        price_change_percent_24h: "-1.63"
                        timestamp: 1773292807000
                      - symbol: "AAPL.US"
                        last_price: "260.81"
                        volume_24h: "26218927"
                        high_24h: "262.13"
                        low_24h: "259.55"
                        price_change_24h: "-0.02"
                        price_change_percent_24h: "-0.01"
                        timestamp: 1773259201000
  /v1/market/ticker/cn-stock:
    get:
      summary: A股全量行情
      description: 获取A股市场当前全量行情快照，无需请求参数。客户端必须启用 HTTP 响应压缩，并声明支持 gzip、br 或 zstd 中的至少一种格式；未启用压缩时可能返回 406。
      parameters:
        - $ref: "#/components/parameters/FullMarketCompressionHeader"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMarketTickerResponse"
        '406':
          description: 客户端不支持服务要求的响应压缩格式。
        '503':
          description: 全量行情快照暂不可用，请稍后重试。
  /v1/market/ticker/hk-stock:
    get:
      summary: 港股全量行情
      description: 获取港股市场当前全量行情快照，无需请求参数。客户端必须启用 HTTP 响应压缩，并声明支持 gzip、br 或 zstd 中的至少一种格式；未启用压缩时可能返回 406。
      parameters:
        - $ref: "#/components/parameters/FullMarketCompressionHeader"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMarketTickerResponse"
        '406':
          description: 客户端不支持服务要求的响应压缩格式。
        '503':
          description: 全量行情快照暂不可用，请稍后重试。
  /v1/market/ticker/us-stock:
    get:
      summary: 美股全量行情
      description: 获取美股市场当前全量行情快照，无需请求参数。客户端必须启用 HTTP 响应压缩，并声明支持 gzip、br 或 zstd 中的至少一种格式；未启用压缩时可能返回 406。
      parameters:
        - $ref: "#/components/parameters/FullMarketCompressionHeader"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMarketTickerResponse"
        '406':
          description: 客户端不支持服务要求的响应压缩格式。
        '503':
          description: 全量行情快照暂不可用，请稍后重试。
  /v1/market/kline:
    get:
      summary: Candlestick Data
      description: Query candlesticks for a symbol by interval and time range. The last candlestick may still be forming.
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading symbol
          schema:
            type: string
            default: "700.HK"
            example: "700.HK"
        - name: interval
          in: query
          required: true
          description: K-line interval
          schema:
            type: string
            enum: ["1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "1d", "1w", "1M"]
            default: "1h"
            example: "1h"
        - name: limit
          in: query
          required: false
          description: Number of records (default 100). Values above 1000 are capped at 1000; non-positive values use the default.
          schema:
            type: integer
            example: 100
        - name: start_time
          in: query
          required: false
          description: Start timestamp in milliseconds
          schema:
            type: integer
            example: 1703123456789
        - name: end_time
          in: query
          required: false
          description: End timestamp in milliseconds
          schema:
            type: integer
            example: 1703209856789
        - name: type
          in: query
          required: false
          description: Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an AMBIGUOUS_SYMBOL error, pass the value as indicated
          schema:
            type: string
            enum: ["stock", "indices", "crypto", "forex", "futures"]
            example: "stock"
        - name: adjust
          in: query
          required: false
          description: Price adjustment mode for A-shares, HK stocks, and US stocks. If omitted, prices are unadjusted (none).
          schema:
            type: string
            enum: ["none", "forward", "backward"]
            default: "none"
            example: "forward"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: "700.HK"
                      type:
                        type: string
                        enum: ["stock", "indices", "crypto", "forex", "futures"]
                      interval:
                        type: string
                        example: "1h"
                      adjust:
                        type: string
                        enum: ["none", "forward", "backward"]
                        description: Applied price adjustment mode
                        example: "none"
                      klines:
                        type: array
                        items:
