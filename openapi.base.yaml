  /v1/market/capital-flow:
    get:
      summary: Capital Flow
      description: Get capital flow data for a stock
      parameters:
        - name: symbol
          in: query
          required: true
          description: Stock symbol
          schema:
            type: string
            example: "700.HK"
            default: "700.HK"
        - name: type
          in: query
          required: false
          description: Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an AMBIGUOUS_SYMBOL error, pass the value as indicated
          schema:
            type: string
            enum: ["stock", "indices", "crypto", "forex"]
            example: "stock"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                      timestamp:
                        type: integer
                        format: int64
                        description: 数据更新时间，Unix 时间戳，单位为秒。
                      intraday_flow:
                        type: array
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: integer
                              format: int64
                              description: 分钟开始时间，Unix 时间戳，单位为秒。
                            inflow:
                              type: string
                      distribution:
                        type: object
                        properties:
                          timestamp:
                            type: integer
                            format: int64
                            description: 数据更新时间，Unix 时间戳，单位为秒。
                          capital_in:
                            type: object
                            properties:
                              large:
                                type: string
                              medium:
                                type: string
                              small:
                                type: string
                          capital_out:
                            type: object
                            properties:
                              large:
                                type: string
                              medium:
                                type: string
                              small:
                                type: string
                    example:
                      symbol: "700.HK"
                      timestamp: 1773306211
                      intraday_flow:
                        - timestamp: 1773279000
                          inflow: "-12199.34"
                        - timestamp: 1773279060
                          inflow: "-15137.59"
                      distribution:
                        timestamp: 1773303000
                        capital_in:
                          large: "173056.31"
                          medium: "164958.55"
                          small: "83945.69"
                        capital_out:
                          large: "179434.39"
                          medium: "176045.91"
                          small: "92979.74"
