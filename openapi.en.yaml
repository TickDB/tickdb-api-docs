  /v1/market/trade-days:
    get:
      summary: Trading Calendar
      description: Query the list of trading days for a specified market within a specific time range, used to determine if a particular day is a trading day.
      parameters:
        - name: market
          in: query
          required: true
          description: "Market code: `US`, `HK`, or `CN`"
          schema:
            type: string
            enum:
              - US
              - HK
              - CN
            default: US
            example: US
        - name: beg_day
          in: query
          required: true
          description: Start date in YYYYMMDD format; must be within the most recent year
          schema:
            type: string
            pattern: ^[0-9]{8}$
            default: "20260201"
            example: "20260201"
        - name: end_day
          in: query
          required: true
          description: End date in YYYYMMDD format; the range from the start date cannot exceed 31 days
          schema:
            type: string
            pattern: ^[0-9]{8}$
            default: "20260228"
            example: "20260228"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - data
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    const: 0
                    example: 0
                  data:
                    type: object
                    required:
                      - market
                      - trade_days
                      - half_trade_days
                    additionalProperties: false
                    properties:
                      market:
                        type: string
                        enum:
                          - US
                          - HK
                          - CN
