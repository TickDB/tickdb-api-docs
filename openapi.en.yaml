          type: string
          description: Trading-statistics period.
        trading_details:
          type: array
          description: Trading detail list for the period.
          items:
            type: object
            additionalProperties: true
      additionalProperties: false
    FundHoldingsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - page
          properties:
            data:
              $ref: "#/components/schemas/FundHoldingsData"
            page:
              $ref: "#/components/schemas/PageInfo"
    PageInfo:
      type: object
      required:
        - next_cursor
        - limit
      properties:
        next_cursor:
          type:
            - string
            - "null"
          description: Cursor for the next page; pass a non-empty value unchanged as the next request’s `cursor` parameter. `null` on the final page.
        limit:
          type: integer
          minimum: 1
          description: Current page limit.
      additionalProperties: true
    FundHoldingsData:
      type: object
      required:
        - symbol
        - total
        - members
      properties:
        symbol:
          type: string
          description: Stock symbol.
        total:
          type: integer
          description: Total number of fund records holding the stock.
        members:
          type: array
          description: Funds that disclose holdings in the stock.
          items:
            $ref: "#/components/schemas/FundHoldingMember"
      additionalProperties: true
    FundHoldingMember:
      type: object
      required:
        - fund_code
        - fund_symbol
        - fund_name
        - currency
        - position_ratio
        - report_date
      properties:
        fund_code:
          type: string
          description: Fund code.
        fund_symbol:
          type: string
          description: Standardized fund symbol.
        fund_name:
          type: string
          description: Fund name.
        currency:
          type: string
          description: Currency.
        position_ratio:
          type:
            - string
            - number
            - "null"
          description: Weight of the stock in the fund's holdings.
        report_date:
          type: string
          format: date
          description: Report date in `YYYY-MM-DD` format.
      additionalProperties: true
    NewsEnvelope:
      type: object
      required:
        - code
        - data
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: "#/components/schemas/NewsData"
      additionalProperties: false
    NewsData:
      type: object
      required:
        - symbol
        - limit
        - news
      properties:
        symbol:
          type: string
          description: Stock symbol.
        limit:
          type: integer
          description: Maximum number of records for this request.
        news:
          type: array
          description: News list.
          items:
            $ref: "#/components/schemas/NewsItem"
      additionalProperties: false
    NewsItem:
      type: object
      required:
        - news_id
        - title
        - description
        - published_at
        - has_body
      properties:
        news_id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: News ID, which can be used to query details.
        title:
          type: string
          description: News title.
        description:
          type:
            - string
            - "null"
          description: News summary.
        published_at:
          type: string
          format: date-time
          description: Publication time as an RFC 3339 date-time string in UTC.
        has_body:
          type: boolean
          description: Whether an article body is available.
      additionalProperties: false
    NewsDetailEnvelope:
      type: object
      required:
        - code
        - data
      properties:
        code:
          type: integer
          const: 0
        data:
          $ref: "#/components/schemas/NewsDetailItem"
      additionalProperties: false
    NewsDetailItem:
      type: object
      required:
        - news_id
        - title
        - description
        - published_at
        - detail_status
        - content_scope
        - body_text
        - body_html
      properties:
        news_id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: News ID.
        title:
          type: string
          description: News title.
        description:
          type:
            - string
            - "null"
          description: News summary.
        published_at:
          type: string
          format: date-time
          description: Publication time as an RFC 3339 date-time string in UTC.
        detail_status:
          type: string
          enum:
            - pending
            - succeeded
            - blocked
            - failed
        content_scope:
          type: string
          enum:
            - full
            - excerpt
            - unknown
            - none
        body_text:
          type:
            - string
            - "null"
          description: Plain-text body; may be `null` when unavailable.
        body_html:
          type:
            - string
            - "null"
          description: HTML body; may be `null` when unavailable.
      additionalProperties: false
    NewsErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: TickDB API business error code; may be an integer or string.
          oneOf:
            - type: integer
            - type: string
        message:
          type: string
          description: Error description.
        error:
          type: string
          description: Compatibility error identifier; present only in some error responses.
        data:
          description: Optional error context.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: true
            - type: array
              items: {}
      additionalProperties: true
    CalendarEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - page
          properties:
            data:
              $ref: "#/components/schemas/CalendarData"
            page:
              $ref: "#/components/schemas/CalendarPage"
    CalendarPage:
      type: object
      required:
        - next_cursor
        - limit
      properties:
        next_cursor:
          type:
            - string
            - "null"
          description: Next-page cursor; `null` on the final page.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Current page limit.
      additionalProperties: false
    CalendarData:
      type: object
      required:
        - from
        - to
        - events
      properties:
        from:
          type: string
          format: date
          description: Query start date, `YYYY-MM-DD`.
        to:
          type: string
          format: date
          description: Query end date, `YYYY-MM-DD`.
        events:
          type: array
          description: Events on this page; an empty array if none match.
          maxItems: 500
          items:
            $ref: "#/components/schemas/FullCalendarEvent"
      additionalProperties: false
    FullCalendarEvent:
      type: object
      required:
        - category
        - content
        - counter_name
        - currency
        - date_type
        - event_datetime
        - event_type
        - market
        - star
        - symbol
      properties:
        category:
          type: string
          description: Detailed event category; may be more specific than the request category.
        event_datetime:
          type: string
          format: date-time
          description: Event time as a UTC date-time string.
        symbol:
          type: string
          description: Associated product symbol; may be empty when not applicable.
        market:
          type: string
          enum:
            - US
            - HK
            - CN
          description: Associated market.
        event_type:
          type: string
          description: Event type.
        content:
          type: string
          description: Event description.
        counter_name:
          type:
            - string
            - "null"
          description: Associated name; may be `null`.
        date_type:
          type:
            - string
            - "null"
          description: Event date type; may be `null`.
        star:
          type: integer
          description: Importance level.
        currency:
          type:
            - string
            - "null"
          description: Currency; may be `null`.
        issue_price:
          type:
            - string
            - "null"
          description: IPO issue price; returned for applicable events and `null` when unavailable.
        data:
          type: array
          description: Additional event data; omitted when unavailable.
          items:
            $ref: "#/components/schemas/CalendarEventData"
      additionalProperties: false
    CalendarEventData:
      type: object
      required:
        - key
        - value_type
        - value_text
        - value_raw
      properties:
        key:
          type: string
          description: Additional-data key.
        value_type:
          type: string
          description: Value type.
        value_text:
          type:
            - string
            - "null"
          description: Display value; may be `null`.
        value_raw:
          type:
            - string
            - "null"
          description: Raw value; may be `null`.
      additionalProperties: false
    FullMarketTicker:
      type: object
      required:
        - symbol
        - last_price
        - timestamp
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: Trading product symbol.
        name:
          type: string
          description: Product name.
        type:
          type: string
          enum:
            - stock
            - indices
          description: "Product type: `stock` for equity-like products or `indices` for indices."
        category:
          type: string
          enum:
            - sh_stock
            - sz_stock
            - bj_stock
            - etf
            - cn_index
            - cn_bond
          description: A-share product subcategory; returned only in the A-share full-market feed.
        last_price:
          type: string
          description: Latest traded price.
        open:
          type: string
          description: Current-day open; omitted when unavailable.
        prev_close:
          type: string
          description: Previous trading day's close; omitted when unavailable.
        volume_24h:
          type: string
          description: Current-day cumulative volume.
        quote_volume_24h:
          type: string
          description: Current-day cumulative traded value.
        high_24h:
          type: string
          description: Current-day high.
        low_24h:
          type: string
          description: Current-day low.
        price_change_24h:
          type: string
          description: Price change from the previous close.
        price_change_percent_24h:
          type: string
          description: Percentage price change from the previous close.
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
    FullMarketTickerResponse:
      type: object
      required:
        - code
        - message
        - data
      additionalProperties: false
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/FullMarketTicker"
x-user-api-scope:
  primary_user_api_count: 25
  authentication: X-API-Key
x-fundamentals-product-scope:
  supported_stock_categories:
    - market: US
      exchanges:
        - NASDAQ
        - NYSE
        - AMEX
      category: stock
    - market: HK
      exchanges:
        - HKEX
      category: stock
    - market: CN
      exchanges:
        - SH
        - SZ
      category: stock
  unsupported_upstream_categories:
    - US_ARCA
    - US_BATS
    - CN_BJ_STOCK
    - CN_SH_ETF
    - CN_SZ_ETF
  unsupported_behavior: 不承诺 fundamentals 数据可用性；当前接口行为包括结构化 404 或格式正确的成功空响应。
paths:
  /v1/apikeys/subscriptions:
    get:
      tags:
        - account
      summary: API Key Management
      description: Check when your API keys expire and set up alerts without signing in to the website.
      operationId: getAPIKeyStatus
      responses:
        "200":
          $ref: "#/components/responses/APIKeyStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/market/ticker:
    get:
      summary: Ticker Snapshot
      description: Retrieve real-time market ticker data for one or more trading symbols.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Trading symbol codes, comma-separated, max 50
          schema:
            type: string
            default: 700.HK,AAPL.US
            example: 700.HK,AAPL.US
        - name: type
          in: query
          required: false
          description: "Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an `AMBIGUOUS_SYMBOL` error, pass the value as indicated. Values: `stock`, `indices`, `crypto`, `forex`, `futures`"
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - symbol
                        - last_price
                        - timestamp
                      additionalProperties: false
                      properties:
                        symbol:
                          type: string
                          description: Trading Symbol
                        name:
                          type: string
                          description: Product name; returned when name information is available
                        type:
                          type: string
                          enum:
                            - stock
                            - indices
                            - crypto
                            - forex
                            - futures
                          description: Product type; returned when the type can be resolved
                        category:
                          type: string
                          description: A-share product category, such as `sh_stock`, `sz_stock`, `bj_stock`, `etf`, `cn_bond`, or `cn_index`; returned only for A-share products when category information is available
                        last_price:
                          type: string
                          description: Last traded price
                        open:
                          type: string
                          description: Open price; returned when the statistic is available. It normally represents the current trading day or session for traditional markets and the applicable statistics window for crypto
                        prev_close:
                          type: string
                          description: Previous close or reference price; returned when available. It normally represents the previous trading day or session for traditional markets and the applicable statistics window for crypto
                        bid_price:
                          type: string
                          description: Best bid price; returned when order-book quotes are available
                        ask_price:
                          type: string
                          description: Best ask price; returned when order-book quotes are available
                        volume_24h:
                          type: string
                          description: Cumulative traded volume; returned when available. Crypto normally uses a rolling 24-hour window, while traditional markets normally use the current trading day or session
                        quote_volume_24h:
                          type: string
                          description: Traded value for the same window as `volume_24h`; returned when traded-value data is available
                        high_24h:
                          type: string
                          description: High price; returned when available, using the same statistics window as `volume_24h`
                        low_24h:
                          type: string
                          description: Low price; returned when available, using the same statistics window as `volume_24h`
                        price_change_24h:
                          type: string
                          description: Price change; returned when available, using the same statistics window as `volume_24h`
                        price_change_percent_24h:
                          type: string
                          description: Percentage price change; returned when available. Non-empty numeric values are formatted to two decimal places
                        timestamp:
                          type: integer
                          format: int64
                          description: Unix timestamp in milliseconds
                        pre_market_quote:
                          type: object
                          description: Pre-market quote object; returned for products with extended-hours trading, such as US stocks, when pre-market data is available
                          required:
                            - last_done
                            - timestamp
                            - volume
                            - high
                            - low
                            - prev_close
                          additionalProperties: false
                          properties:
                            last_done:
                              type: string
                              description: Last Price
                            timestamp:
                              type: integer
                              format: int64
                              description: Unix timestamp in milliseconds
                            volume:
                              type: integer
                              format: int64
                              description: Trading volume
                            quote_volume:
                              type: string
                              description: Trading amount; normally omitted for futures
                            high:
                              type: string
                              description: Highest price
                            low:
                              type: string
                              description: Lowest price
                            prev_close:
                              type: string
                              description: Previous close or reference price; returned when available. It normally represents the previous trading day or session for traditional markets and the applicable statistics window for crypto
                        post_market_quote:
                          type: object
                          description: Post-market quote object; returned for products with extended-hours trading, such as US stocks, when post-market data is available
                          required:
                            - last_done
                            - timestamp
                            - volume
                            - high
                            - low
                            - prev_close
                          additionalProperties: false
                          properties:
                            last_done:
                              type: string
                              description: Last Price
                            timestamp:
                              type: integer
                              format: int64
                              description: Unix timestamp in milliseconds
                            volume:
                              type: integer
                              format: int64
                              description: Trading volume
                            quote_volume:
                              type: string
                              description: Trading amount; normally omitted for futures
                            high:
                              type: string
                              description: Highest price
                            low:
                              type: string
                              description: Lowest price
                            prev_close:
                              type: string
                              description: Previous close or reference price; returned when available. It normally represents the previous trading day or session for traditional markets and the applicable statistics window for crypto
                        overnight_quote:
                          type: object
                          description: Overnight quote object; returned for products with extended-hours trading, such as US stocks, when overnight data is available
                          required:
                            - last_done
                            - timestamp
                            - volume
                            - high
                            - low
                            - prev_close
                          additionalProperties: false
                          properties:
                            last_done:
                              type: string
                              description: Last Price
                            timestamp:
                              type: integer
                              format: int64
                              description: Unix timestamp in milliseconds
                            volume:
                              type: integer
                              format: int64
                              description: Trading volume
                            quote_volume:
                              type: string
                              description: Trading amount; normally omitted for futures
                            high:
                              type: string
                              description: Highest price
                            low:
                              type: string
                              description: Lowest price
                            prev_close:
                              type: string
                              description: Previous close or reference price; returned when available. It normally represents the previous trading day or session for traditional markets and the applicable statistics window for crypto
                    example:
                      - symbol: 700.HK
                        last_price: "543"
                        volume_24h: "11205874"
                        high_24h: "557"
                        low_24h: "543"
                        price_change_24h: "-9"
                        price_change_percent_24h: "-1.63"
                        timestamp: 1773292807000
                      - symbol: AAPL.US
                        last_price: "260.81"
                        volume_24h: "26218927"
                        high_24h: "262.13"
                        low_24h: "259.55"
                        price_change_24h: "-0.02"
                        price_change_percent_24h: "-0.01"
                        timestamp: 1773259201000
  /v1/market/ticker/cn-stock:
    get:
      summary: Full A-Share Market Tickers
      description: Retrieve the current full-market ticker snapshot for A-shares.
      parameters:
        - $ref: "#/components/parameters/FullMarketCompressionHeader"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMarketTickerResponse"
        "406":
          description: Successful response.
        "503":
          description: Successful response.
  /v1/market/ticker/hk-stock:
    get:
      summary: Full HK Stock Market Tickers
      description: Retrieve the current full-market ticker snapshot for the Hong Kong market.
      parameters:
        - $ref: "#/components/parameters/FullMarketCompressionHeader"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMarketTickerResponse"
        "406":
          description: Successful response.
        "503":
          description: Successful response.
  /v1/market/ticker/us-stock:
    get:
      summary: Full US Stock Market Tickers
      description: Retrieve the current full-market ticker snapshot for the US market.
      parameters:
        - $ref: "#/components/parameters/FullMarketCompressionHeader"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMarketTickerResponse"
        "406":
          description: Successful response.
        "503":
          description: Successful response.
  /v1/market/kline:
    get:
      summary: Candlestick Data
      description: Query candlestick data (OHLC bars) by interval and time range.
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading symbol code
          schema:
            type: string
            default: 700.HK
            example: 700.HK
        - name: interval
          in: query
          required: true
          description: "K-line period, options: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d, 1w, 1M"
          schema:
            type: string
            enum:
              - 1m
              - 3m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 1d
              - 1w
              - 1M
            default: 1h
            example: 1h
        - name: limit
          in: query
          required: false
          description: Number of records; defaults to 100. Values above 1000 are capped at 1000, and non-positive values use the default of 100
          schema:
            type: integer
            example: 100
        - name: start_time
          in: query
          required: false
          description: Start timestamp (milliseconds)
          schema:
            type: integer
            example: 1703123456789
        - name: end_time
          in: query
          required: false
          description: End timestamp (milliseconds)
          schema:
            type: integer
            example: 1703209856789
        - name: type
          in: query
          required: false
          description: "Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an `AMBIGUOUS_SYMBOL` error, pass the value as indicated. Values: `stock`, `indices`, `crypto`, `forex`, `futures`"
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
        - name: adjust
          in: query
          required: false
          description: "Price adjustment for A-shares, HK stocks, and US stocks: `none` (unadjusted), `forward`, or `backward`. If omitted, prices are unadjusted (`none`)"
          schema:
            type: string
            enum:
              - none
              - forward
              - backward
            default: none
            example: forward
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: 700.HK
                      type:
                        type: string
                        enum:
                          - stock
                          - indices
                          - crypto
                          - forex
                          - futures
                      interval:
                        type: string
                        example: 1h
                      adjust:
                        type: string
                        enum:
                          - none
                          - forward
                          - backward
                        description: "Applied price adjustment mode: `none`, `forward`, or `backward`"
                        example: none
                      klines:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: integer
                            open:
                              type: string
                            high:
                              type: string
                            low:
                              type: string
                            close:
                              type: string
                            volume:
                              type: string
                            quote_volume:
                              type: string
                              description: Trading amount; normally omitted for futures
                            open_interest:
                              type: string
                              description: Open interest; returned for futures
                        example:
                          - time: 1773291600000
                            open: "545.5"
                            high: "546.5"
                            low: "541.5"
                            close: "543.5"
                            volume: "1549300"
                            quote_volume: "842560983.33"
  /v1/market/depth:
    get:
      summary: Order Book
      description: Retrieve real-time order book depth (bids & asks) for a trading symbol.
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading symbol code
          schema:
            type: string
            default: 700.HK
            example: 700.HK
        - name: type
          in: query
          required: false
          description: "Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an `AMBIGUOUS_SYMBOL` error, pass the value as indicated. Values: `stock`, `indices`, `crypto`, `forex`, `futures`"
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: 700.HK
                      type:
                        type: string
                        enum:
                          - stock
                          - indices
                          - crypto
                          - forex
                          - futures
                      timestamp:
                        type: integer
                        example: 1768274016162
                      bids:
                        type: array
                        description: Bid array, each element is [price, quantity]
                        items:
                          type: array
                          items:
                            type: string
                        example:
                          - - "626"
                            - "19700"
                          - - "625.5"
                            - "40800"
                      asks:
                        type: array
                        description: Ask array, each element is [price, quantity]
                        items:
                          type: array
                          items:
