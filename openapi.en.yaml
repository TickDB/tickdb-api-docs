                              example: 0
                            position_effect:
                              type: string
                              description: Position effect; futures only; see values below
                              enum:
                                - long_open
                                - short_open
                                - both_open
                                - long_close
                                - short_close
                                - both_close
                                - long_transfer
                                - short_transfer
                              example: short_transfer
  /v1/symbols/available:
    get:
      summary: Symbol Query
      description: Query products supported by TickDB, covering forex, indices, US stocks, HK stocks, A-shares, China futures, Hong Kong futures, and crypto markets, with the product list continuously growing.
      parameters:
        - name: type
          in: query
          required: false
          description: "Product type filter: stock, crypto, forex, indices, futures"
          schema:
            type: string
            enum:
              - stock
              - crypto
              - forex
              - indices
              - futures
            example: stock
        - name: market
          in: query
          required: false
          description: "Market filter: GLOBAL, US, HK, CN"
          schema:
            type: string
            enum:
              - GLOBAL
              - US
              - HK
              - CN
            example: CN
        - name: limit
          in: query
          required: false
          description: Number of results per page, default 100, max 1000
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 50
        - name: offset
          in: query
          required: false
          description: Pagination offset, default 0
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            symbol:
                              type: string
                              example: 000001.SZ
                            name:
                              type: string
                              example: 平安银行
                            market:
                              type: string
                              example: CN
                            type:
                              type: string
                              example: stock
                            currency:
                              type: string
                              example: CNY
                            is_active:
                              type: boolean
                              example: true
                            updated_at:
                              type: string
                              format: date-time
                              description: Last updated time as an RFC 3339 date-time string with a time-zone offset
                              example: 2026-03-15T20:27:58Z
                      summary:
                        type: object
                        properties:
                          total_products:
                            type: integer
                            example: 32492
                          by_market:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              CN: 6643
                              GLOBAL: 14833
                              HK: 2909
                              US: 8107
                          by_type:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              crypto: 877
                              stock: 17658
                              forex: 1207
                              indices: 12750
                          last_updated:
                            type: string
                            format: date-time
                            description: Last updated time as an RFC 3339 date-time string with a time-zone offset
                            example: 2026-03-27T11:09:44+08:00
                      pagination:
                        type: object
                        properties:
                          limit:
                            type: integer
                            example: 10
                          offset:
                            type: integer
                            example: 0
                          total:
                            type: integer
                            example: 6642
                          count:
                            type: integer
                            example: 10
  /v1/market/kline/latest:
    get:
      summary: Latest Candlesticks
      description: Get the latest candlestick data (OHLC bars) for multiple symbols; the current bar may still be forming.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Trading symbol codes, comma-separated, up to 50, e.g., AAPL.US,00700.HK
          schema:
            type: string
            default: AAPL.US,00700.HK
            example: AAPL.US,00700.HK
        - name: interval
          in: query
          required: true
          description: "K-line period, options: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d, 1w, 1M"
          schema:
            type: string
            enum:
              - 1m
              - 3m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 1d
              - 1w
              - 1M
            default: 3m
            example: 3m
        - name: type
          in: query
          required: false
          description: "Symbol type, optional. Not required when the symbol is unambiguous; if the API returns an `AMBIGUOUS_SYMBOL` error, pass the value as indicated. Values: `stock`, `indices`, `crypto`, `forex`, `futures`"
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
        - name: adjust
          in: query
          required: false
          description: "Price adjustment for A-shares, Hong Kong stocks, and US stocks: `none` (unadjusted), `forward`, or `backward`. If omitted, prices are unadjusted (`none`)"
          schema:
            type: string
            enum:
              - none
              - forward
              - backward
            default: none
            example: forward
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        type:
                          type: string
                          enum:
                            - stock
                            - indices
                            - crypto
                            - forex
                            - futures
                        interval:
                          type: string
                        adjust:
                          type: string
                          enum:
                            - none
                            - forward
                            - backward
                          description: "Applied price adjustment: `none`, `forward`, or `backward`"
                          example: none
                        klines:
                          type: array
                          items:
                            type: object
                            properties:
                              time:
                                type: integer
                              open:
                                type: string
                              high:
                                type: string
                              low:
                                type: string
                              close:
                                type: string
                              volume:
                                type: string
                              quote_volume:
                                type: string
                                description: Trading amount; normally omitted for futures
                              open_interest:
                                type: string
                                description: Open interest; returned for futures
                    example:
                      - symbol: AAPL.US
                        interval: 3m
                        adjust: none
                        klines:
                          - time: 1773259020000
                            open: "260.86"
                            high: "261.05"
                            low: "260.7"
                            close: "260.81"
                            volume: "963419"
                            quote_volume: "251311057.55"
                      - symbol: 00700.HK
                        interval: 3m
                        adjust: none
                        klines:
                          - time: 1773293400000
                            open: "542.5"
                            high: "544.5"
                            low: "542"
                            close: "544.5"
                            volume: "80300"
                            quote_volume: "43656433.33"
        "400":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid parameters
        "401":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthorized
  /v1/market/kline/ex-factors:
    get:
      summary: Adjustment Factors
      description: Get forward and backward price adjustment factors for A-shares, HK stocks, and US stocks.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Stock symbols, comma-separated
          schema:
            type: string
            default: 600519.SH
            example: 600519.SH,700.HK,AAPL.US
        - name: type
          in: query
          required: false
          description: Product type. Only `stock` is supported; omit it when the symbol is unambiguous
          schema:
            type: string
            enum:
              - stock
            example: stock
        - name: start_time
          in: query
          required: false
          description: Start timestamp in milliseconds, inclusive
          schema:
            type: integer
            format: int64
        - name: end_time
          in: query
          required: false
          description: End timestamp in milliseconds, inclusive
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        description: Adjustment factors grouped by stock symbol
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            required:
                              - timestamp
                              - adjust
                              - factor_a
                              - factor_b
                            properties:
                              timestamp:
                                type: integer
                                format: int64
                                description: Factor effective timestamp in milliseconds
                              adjust:
                                type: string
                                enum:
                                  - forward
                                  - backward
                                description: "Adjustment direction: `forward` or `backward`"
                              factor_a:
                                type: number
                                description: Multiplicative factor in the adjustment formula
                              factor_b:
                                type: number
                                description: Additive factor in the adjustment formula
        "400":
          description: Successful response.
        "503":
          description: Successful response.
