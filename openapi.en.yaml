openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: TickDB API
  description: TickDB unified real-time market data API via REST and WebSocket.
  version: 1.0.3
  contact:
    email: support@tickdb.ai
servers:
  - url: https://api.tickdb.ai
    description: Production server
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema:
        type: string
        examples:
          - AAPL
          - "700"
          - "600519"
          - AAPL.US
          - 700.HK
          - 600519.SH
      description: Stock symbol
    TypeQuery:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - stock
      description: Product type; currently supports `stock`
    RequiredMarketQuery:
      name: market
      in: query
      required: true
      schema:
        type: string
        enum:
          - US
          - HK
          - CN
      description: "Market code: `US` US stocks, `HK` Hong Kong stocks, or `CN` A-shares"
    FromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        examples:
          - 2024-01-01
      description: Start date in `YYYY-MM-DD` format
    ToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        examples:
          - 2026-12-31
      description: End date in `YYYY-MM-DD` format
    DividendTypeQuery:
      name: dividend_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - normal
          - special
          - non_cash
          - unknown
      description: "`normal`, `special`, `non_cash`, or `unknown`"
    DividendLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Page size; default 100, range `1–500`
    DividendAsOfQuery:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: As-of date in `YYYY-MM-DD` format; defaults to the current date
    KindQuery:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum:
          - IS
          - BS
          - CF
      description: "Statement type: `IS` income statement, `BS` balance sheet, or `CF` cash flow statement"
    TTMKindQuery:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum:
          - IS
          - CF
      description: "Statement type: `IS` income statement or `CF` cash flow statement"
    PeriodTypeQuery:
      name: period_type
      in: query
      required: false
      schema:
        type: string
        default: q1,q2,q3,q4
        pattern: ^(q1|q2|q3|q4|saf|af)(,(q1|q2|q3|q4|saf|af))*$
        examples:
          - q1
          - saf
          - af
          - q1,q2,q3,q4
      description: "Financial period type: `q1` first quarter, `q2` second quarter, `q3` third quarter, `q4` fourth quarter, `saf` semiannual, or `af` annual; separate multiple values with commas"
    NQuery:
      name: n
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
      description: Number of periods, range `1–20`
    SegmentLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
      description: Number of records; default 200, range `1–1000`
    IndustryRankLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Number of records; default 50, range `1–200`
    FundHoldingsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      description: Number of records per page; default `200`, range `1–500`
    NewsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum number of records to return; default `50`, range `1–200`
    NewsIDPath:
      name: news_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description: Opaque article ID returned by the news list; pass it as a string
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Next-page cursor; omit on the first request
    SegmentCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum:
          - business
          - regional
      description: "Breakdown dimension: `business` for business segments or `regional` for geographic segments. Omit to return all available dimensions."
    ReportQuery:
      name: report
      in: query
      required: false
      schema:
        type: string
        examples:
          - qf
          - saf
          - af
      description: "Reporting period: `qf` quarterly, `saf` semiannual, or `af` annual"
    GranularityQuery:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum:
          - daily
          - monthly
        default: daily
      description: "`daily` or `monthly`; default `daily`"
    ValuationFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start date in `YYYY-MM-DD` format
    ValuationToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End date in `YYYY-MM-DD` format
    IndustryCounterIDQuery:
      name: industry_counter_id
      in: query
      required: true
      schema:
        type: string
      description: Industry node ID returned by Industry Metric Rankings
    ObjectIDQuery:
      name: object_id
      in: query
      required: true
      schema:
        type: string
      description: Object ID from a shareholder holdings record with `detail_available=true`
    CalendarOtherCategoryQuery:
      name: category
      in: query
      required: true
      schema:
        type: string
        enum:
          - macrodata
          - closed
          - meeting
          - merge
          - halt_resume
          - special_treatment
          - special_treatment_start
          - special_treatment_end
          - listing_status
          - listing_suspension
          - listing_resumption
          - delisting
          - lockup_expiry
      description: Other-event category; see the table below
    CalendarMarketQuery:
      name: market
      in: query
      required: false
      schema:
        type: string
        enum:
          - US
          - HK
          - CN
      description: "Market filter: `US`, `HK`, or `CN`; required for market-restricted API keys"
    FullMarketCompressionHeader:
      name: Accept-Encoding
      in: header
      required: true
      description: Full-market responses require compression. Support at least one of gzip, br, or zstd; gzip is the default.
      schema:
        type: string
        enum:
          - gzip
          - br
          - zstd
        default: gzip
    CalendarFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive start date, `YYYY-MM-DD`
    CalendarToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive end date, `YYYY-MM-DD`
    CalendarSymbolsQuery:
      name: symbols
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        examples:
          - AAPL.US
          - AAPL.US,700.HK,600519.SH
      description: Comma-separated stock symbols, up to 50
    CalendarLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Page size, `1–500`; default `100`
  responses:
    APIKeyStatusResponse:
      description: API Key Management response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIKeyStatusEnvelope"
    ProfileResponse:
      description: Company Profile response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
    ExecutivesResponse:
      description: Executives and Directors response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecutivesEnvelope"
    FinancialRowsResponse:
      description: Recent Financial Statements response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FinancialRowsEnvelope"
    SegmentsResponse:
      description: Historical Revenue Breakdown response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SegmentsEnvelope"
    SegmentsLatestResponse:
      description: Revenue Breakdown response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SegmentsLatestEnvelope"
    ValuationLatestResponse:
      description: Latest Valuation response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValuationLatestEnvelope"
    ValuationTimeSeriesResponse:
      description: Historical Valuation response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValuationTimeSeriesEnvelope"
    IndustryPeersResponse:
      description: Peer Valuation Comparison response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustryPeersEnvelope"
    IndustryDistributionResponse:
      description: Industry Valuation Distribution response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustryDistributionEnvelope"
    IndustriesRankResponse:
      description: Industry Metric Rankings response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustriesRankEnvelope"
    IndustriesTreeResponse:
      description: Industry Hierarchy response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustriesTreeEnvelope"
    DividendsResponse:
      description: Dividend Records response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DividendsEnvelope"
    DividendsTTMResponse:
      description: Dividend TTM response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DividendsTTMEnvelope"
    BuybackResponse:
      description: Share Buybacks response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BuybackEnvelope"
    LatestShareholdersResponse:
      description: Latest Shareholder Structure response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LatestShareholdersEnvelope"
    TopShareholdersResponse:
      description: Shareholder Holdings response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopShareholdersEnvelope"
    ShareholderDetailResponse:
      description: Shareholder Holding Details response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ShareholderDetailEnvelope"
    FundHoldingsResponse:
      description: Funds Holding a Stock response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundHoldingsEnvelope"
    CorporateActionsResponse:
      description: Corporate Actions response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CorporateActionsEnvelope"
    NewsResponse:
      description: Stock News response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsEnvelope"
    NewsDetailResponse:
      description: News Details response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsDetailEnvelope"
    NewsErrorResponse:
      description: Error response. Common HTTP statuses include 400 (invalid parameters), 401 (authentication failed), 403 (permission or quota restriction), 404 (no matching data), 429 (rate limit), and 503 (service temporarily unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsErrorEnvelope"
    CalendarResponse:
      description: Earnings Calendar response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarEnvelope"
    ErrorResponse:
      description: Error response. Common HTTP statuses include 400 (invalid parameters), 401 (authentication failed), 403 (permission or quota restriction), 404 (no matching data), 429 (rate limit), and 503 (service temporarily unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missingAPIKey:
              summary: Missing API key
              value:
                code: "1002"
                message: API key is required. Provide via X-API-Key header
                error: "1002"
            missingKind:
              summary: Missing required parameter
              value:
                code: 40001
                message: kind is required
                data: null
            endpointForbidden:
              summary: API key cannot access this endpoint
              value:
                code: 3009
                message: This endpoint is not allowed for your API key
                data: null
            marketForbidden:
              summary: API key cannot access this market
              value:
                code: 3010
                message: Fundamentals market not allowed for your API key
                data:
                  market: US
            noAvailableSource:
              summary: Data temporarily unavailable
              value:
                code: 5003
                message: Data is temporarily unavailable
                data: null
            notFound:
              summary: No matching data
              value:
                code: 40404
                message: shareholder detail not found
                data: null
            businessNoData:
              summary: No business data matches the query
              value:
                code: 40405
                message: valuation time series not found
                data: null
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - code
        - data
      properties:
        code:
          type: integer
          const: 0
          description: Business status code; `0` means success.
    APIKeyStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              description: Response message.
            data:
              $ref: "#/components/schemas/APIKeyStatusData"
    APIKeyStatusData:
      type: object
      required:
        - server_time
        - total
        - api_keys
      properties:
        server_time:
          type: string
          format: date-time
          description: Server time of this request, as a date-time string with a time zone.
        total:
          type: integer
          minimum: 0
          description: Number of API keys returned.
        api_keys:
          type: array
          description: API keys under the account.
          items:
            $ref: "#/components/schemas/APIKeyStatusItem"
      additionalProperties: false
    APIKeyStatusItem:
      type: object
      required:
        - key_prefix
        - name
        - plan
        - status
        - expires_at
        - remaining_seconds
        - created_at
      properties:
        key_prefix:
          type: string
          description: Prefix used to identify the key; this is not the complete key.
        name:
          type: string
          description: API key name.
        plan:
          type: string
          description: Plan identifier associated with the key.
        status:
          type: string
          enum:
            - active
            - expired
            - suspended
            - revoked
          description: "Key status: `active`, `expired`, `suspended`, or `revoked`."
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Expiration time, or `null` if no expiration is set.
        remaining_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: Seconds until expiration; `0` if expired, or `null` if no expiration is set.
        created_at:
          type: string
          format: date-time
          description: API key creation time.
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: TickDB API business error code; may be an integer or string. Convert it to a string before comparing.
          oneOf:
            - type: integer
            - type: string
        message:
          type: string
          description: Error description.
        error:
          type: string
          description: Compatibility error identifier; present only in some error responses.
        data:
          description: Optional error context; may be null, an object, or an array.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: true
            - type: array
              items: {}
    ProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ProfileData"
    ProfileData:
      type: object
      description: Company profile data.
      required:
        - symbol
        - market
        - name
      properties:
        symbol:
          type: string
          description: Normalized stock symbol.
        name:
          type: string
          description: Display name.
        company_name:
          type: string
          description: Full company name.
        market:
          type: string
          description: Market.
        region:
          type: string
          description: Region.
        founded:
          type:
            - string
            - "null"
          description: Founding year or date; `null` when unavailable.
        listing_date:
          type:
            - string
            - "null"
          format: date
          description: Listing date in `YYYY-MM-DD` format; may be `null`.
        year_end:
          type:
            - string
            - "null"
          description: Fiscal year-end information; may be `null`.
        address:
          type: string
          description: Address.
        office_address:
          type: string
          description: Office address.
        phone:
          type: string
          description: Telephone number.
        email:
          type: string
          description: Email address.
        website:
          type: string
          description: Company website.
        employees:
          type: integer
          description: Number of employees.
        chairman:
          type: string
          description: Chairperson.
        manager:
          type: string
          description: Principal manager.
        secretary:
          type: string
          description: Company secretary.
        legal_repr:
          type: string
          description: Legal representative.
        accounting_firm:
          type: string
          description: Accounting firm.
        legal_counsel:
          type: string
          description: Legal counsel.
        category:
          type: string
          description: Company category.
        profile:
          type: string
          description: Business profile.
      additionalProperties: false
    ExecutivesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExecutivesData"
    ExecutivesData:
      type: object
      description: Executive and director data.
      required:
        - symbol
        - total
        - members
      properties:
        symbol:
          type: string
          description: Stock symbol.
        total:
          type: integer
          minimum: 0
          description: Total number of people.
        members:
          type: array
          description: Executives, directors, and key personnel.
          items:
            $ref: "#/components/schemas/Executive"
      additionalProperties: true
    Executive:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name.
        title:
          type: string
          description: Position or title.
        biography:
          type: string
          description: Biography.
      additionalProperties: true
    FinancialRowsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FinancialRowsData"
    FinancialRowsData:
      type: object
      description: Financial statement data. Numeric values are returned as strings to avoid JSON floating-point precision loss.
      required:
        - symbol
        - kind
        - rows
      properties:
        symbol:
          type: string
          description: Stock symbol.
        kind:
          type: string
          enum:
            - IS
            - BS
            - CF
          description: "Statement type: `IS` income statement, `BS` balance sheet, or `CF` cash flow statement."
        rows:
          type: array
          description: Metric records for the selected statement type; a reporting period usually contains multiple records.
          items:
            $ref: "#/components/schemas/FinancialRow"
      additionalProperties: true
    FinancialRow:
      type: object
      required:
        - kind
        - period_type
        - fiscal_year
        - fiscal_period
        - period_end
        - field_name
        - indicator_title
        - value
      properties:
        kind:
          type: string
          enum:
            - IS
            - BS
            - CF
          description: "Statement type: `IS` income statement, `BS` balance sheet, or `CF` cash flow statement."
        field_name:
          type: string
          description: Financial field code; see the [Financial Field Dictionary](./financial_fields_dictionary).
        indicator_title:
          type: string
          description: Metric title.
        field_display:
          type: string
          description: Display name.
        value:
          oneOf:
            - type: string
            - type: number
            - type: "null"
          description: Field value returned as a string.
        fiscal_year:
          type: integer
          description: Fiscal year.
        fiscal_period:
          type: string
          description: Reporting period.
        period_type:
          type: string
          description: "Reporting period type: `q1` to `q4` are the four quarters, `saf` is semiannual, `af` is annual, and `ttm` is trailing 12 months."
        period_end:
          type: string
          format: date
          description: Period end date in `YYYY-MM-DD` format.
        currency:
          type:
            - string
            - "null"
          description: Currency.
        is_percent:
          type: boolean
          description: Whether this is a percentage field.
        yoy:
          type:
            - string
            - number
            - "null"
          description: Year-over-year change; may be `null`.
        ratio:
          type:
            - string
            - number
            - "null"
          description: Ratio; may be `null`.
      additionalProperties: true
    SegmentsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SegmentsData"
    SegmentsLatestEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SegmentsLatestData"
    SegmentsLatestData:
      type: object
      description: Most recent revenue breakdown data.
      required:
        - symbol
        - segments
      properties:
        symbol:
          type: string
          description: Stock symbol.
        segments:
          type: array
          description: Latest revenue breakdown.
          items:
            $ref: "#/components/schemas/SegmentItem"
      additionalProperties: false
    SegmentsData:
      type: object
      required:
        - symbol
        - segments
      properties:
        symbol:
          type: string
          description: Stock symbol.
        report:
          type:
            - string
            - "null"
          description: "Requested reporting period: `qf` quarterly, `saf` semiannual, or `af` annual; may be `null` when not specified."
        segments:
          type: array
          description: Revenue breakdowns for historical reporting periods.
          items:
            $ref: "#/components/schemas/SegmentItem"
      additionalProperties: true
    SegmentItem:
      type: object
      required:
        - report
        - category
        - segment_name
        - period_start
        - period_end
        - value
      properties:
        report:
          type: string
          description: "Reporting period: `qf` quarterly, `saf` semiannual, or `af` annual."
        category:
          type: string
          description: "Breakdown dimension: `business` by business or `regional` by region."
        segment_name:
          type: string
          description: Business segment or region name.
        period_start:
          type: string
          format: date
          description: Period start date in `YYYY-MM-DD` format.
        period_end:
          type: string
          format: date
          description: Period end date in `YYYY-MM-DD` format.
        total_revenue:
          type:
            - string
            - number
            - "null"
          description: Total revenue for the reporting period.
        currency:
          type:
            - string
            - "null"
          description: Amount currency.
        percent:
          type:
            - string
            - number
            - "null"
          description: Percentage of total period revenue, for example `79.74` means 79.74%.
        value:
          type:
            - string
            - number
            - "null"
          description: Revenue amount for the business segment or region.
      additionalProperties: true
    ValuationLatestEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValuationLatestData"
    ValuationLatestData:
      type: object
      required:
        - symbol
        - metrics
      properties:
        symbol:
          type: string
          description: Stock symbol.
        metrics:
          type: object
          required:
            - PE
          properties:
            PE:
              $ref: "#/components/schemas/ValuationMetricSnapshot"
          additionalProperties: false
      additionalProperties: true
    ValuationMetricSnapshot:
      type: object
      required:
        - value
        - high_1y
        - low_1y
        - median_1y
        - desc
