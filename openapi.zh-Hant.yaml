  /v1/fundamentals/market/status:
    get:
      tags:
        - fundamentals-events
      summary: 市場狀態
      description: 查詢不同市場當前的交易階段和市場時間。
      operationId: getFundamentalsMarketStatus
      responses:
        "200":
          description: 請求成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - markets
                        properties:
                          markets:
                            type: array
                            items:
                              type: object
                              required:
                                - market
                                - market_time
                                - trade_status
                              properties:
                                market:
                                  type: string
                                  example: US
                                market_time:
                                  type: string
                                  format: date-time
                                trade_status:
                                  type: integer
        default:
          $ref: "#/components/responses/ErrorResponse"
