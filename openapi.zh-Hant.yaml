openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: TickDB API
  description: TickDB 統一即時行情數據 API，提供 REST 和 WebSocket 接入。
  version: 1.0.3
  contact:
    email: support@tickdb.ai
servers:
  - url: https://api.tickdb.ai
    description: 正式環境
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema:
        type: string
        examples:
          - AAPL
          - "700"
          - "600519"
          - AAPL.US
          - 700.HK
          - 600519.SH
      description: 股票代碼
    TypeQuery:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
          - stock
      description: 產品類型，當前支援 `stock`
    RequiredMarketQuery:
      name: market
      in: query
      required: true
      schema:
        type: string
        enum:
          - US
          - HK
          - CN
      description: 市場代碼：`US` 美股、`HK` 港股、`CN` A股
    FromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        examples:
          - 2024-01-01
      description: 開始日期，格式 `YYYY-MM-DD`
    ToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        examples:
          - 2026-12-31
      description: 結束日期，格式 `YYYY-MM-DD`
    DividendTypeQuery:
      name: dividend_type
      in: query
      required: false
      schema:
        type: string
        enum:
          - normal
          - special
          - non_cash
          - unknown
      description: 分紅類型：`normal`、`special`、`non_cash`、`unknown`。
    DividendLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: 單頁數量，默認 100，范圍 `1–500`
    DividendAsOfQuery:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 統計截止日，格式 `YYYY-MM-DD`；默認當前日期
    KindQuery:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum:
          - IS
          - BS
          - CF
      description: 報表類型：`IS` 利潤表、`BS` 資產負債表、`CF` 現金流量表
    TTMKindQuery:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum:
          - IS
          - CF
      description: 報表類型：`IS` 利潤表或 `CF` 現金流量表
    PeriodTypeQuery:
      name: period_type
      in: query
      required: false
      schema:
        type: string
        default: q1,q2,q3,q4
        pattern: ^(q1|q2|q3|q4|saf|af)(,(q1|q2|q3|q4|saf|af))*$
        examples:
          - q1
          - saf
          - af
          - q1,q2,q3,q4
      description: 財務周期類型：`q1` 第一季度、`q2` 第二季度、`q3` 第三季度、`q4` 第四季度、`saf` 半年度、`af` 年度；多個值用逗號分隔
    NQuery:
      name: n
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
      description: 返回期數，范圍 `1–20`
    SegmentLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
      description: 返回條數，默認 200，范圍 `1–1000`
    IndustryRankLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: 返回條數，默認 50，范圍 `1–200`
    FundHoldingsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
      description: 單頁數量，默認 200，范圍 `1–500`
    NewsLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: 返回數量，默認 50，范圍 `1–200`
    NewsIDPath:
      name: news_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description: 新聞列表返回的不透明文章 ID，按字符串傳遞
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: 下一頁遊標；第一頁不傳
    SegmentCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum:
          - business
          - regional
      description: 營收構成維度：`business` 按業務；`regional` 按地區。不傳返回全部可用維度。
    ReportQuery:
      name: report
      in: query
      required: false
      schema:
        type: string
        examples:
          - qf
          - saf
          - af
      description: 報告周期：`qf` 季度報告、`saf` 半年度報告、`af` 年度報告
    GranularityQuery:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum:
          - daily
          - monthly
        default: daily
      description: "`daily` 或 `monthly`，默認 `daily`"
    ValuationFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 開始日期，格式 `YYYY-MM-DD`
    ValuationToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 結束日期，格式 `YYYY-MM-DD`
    IndustryCounterIDQuery:
      name: industry_counter_id
      in: query
      required: true
      schema:
        type: string
      description: 行業節點 ID，可從行業指標排行介面獲取
    ObjectIDQuery:
      name: object_id
      in: query
      required: true
      schema:
        type: string
      description: 來自股東持倉介面且 `detail_available=true` 的對象 ID
    CalendarOtherCategoryQuery:
      name: category
      in: query
      required: true
      schema:
        type: string
        enum:
          - macrodata
          - closed
          - meeting
          - merge
          - halt_resume
          - special_treatment
          - special_treatment_start
          - special_treatment_end
          - listing_status
          - listing_suspension
          - listing_resumption
          - delisting
          - lockup_expiry
      description: 其他事件類別，取值見下表
    CalendarMarketQuery:
      name: market
      in: query
      required: false
      schema:
        type: string
        enum:
          - US
          - HK
          - CN
      description: 市場篩選：`US`、`HK`、`CN`；市場受限的 API Key 必填
    FullMarketCompressionHeader:
      name: Accept-Encoding
      in: header
      required: true
      description: 全量行情回應必須啟用壓縮，支援 gzip、br 和 zstd，至少選擇一種；預設使用相容性較好的 gzip。
      schema:
        type: string
        enum:
          - gzip
          - br
          - zstd
        default: gzip
    CalendarFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 開始日期，格式 `YYYY-MM-DD`
    CalendarToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: 結束日期，格式 `YYYY-MM-DD`
    CalendarSymbolsQuery:
      name: symbols
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        examples:
          - AAPL.US
          - AAPL.US,700.HK,600519.SH
      description: 股票代碼，以英文逗號分隔，最多 50 個
    CalendarLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: 每頁數量，`1–500`，預設 `100`
  responses:
    APIKeyStatusResponse:
      description: APIKey管理回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIKeyStatusEnvelope"
    ProfileResponse:
      description: 公司資料回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
    ExecutivesResponse:
      description: 高管與董事回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExecutivesEnvelope"
    FinancialRowsResponse:
      description: 近期財務報表回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FinancialRowsEnvelope"
    SegmentsResponse:
      description: 歷史營收構成回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SegmentsEnvelope"
    SegmentsLatestResponse:
      description: 營收構成回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SegmentsLatestEnvelope"
    ValuationLatestResponse:
      description: 最新估值回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValuationLatestEnvelope"
    ValuationTimeSeriesResponse:
      description: 歷史估值回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValuationTimeSeriesEnvelope"
    IndustryPeersResponse:
      description: 同行估值對比回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustryPeersEnvelope"
    IndustryDistributionResponse:
      description: 行業估值分布回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustryDistributionEnvelope"
    IndustriesRankResponse:
      description: 行業指標排行回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustriesRankEnvelope"
    IndustriesTreeResponse:
      description: 行業分類層級回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustriesTreeEnvelope"
    DividendsResponse:
      description: 分紅記錄回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DividendsEnvelope"
    DividendsTTMResponse:
      description: 股息TTM回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DividendsTTMEnvelope"
    BuybackResponse:
      description: 股票回購回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BuybackEnvelope"
    LatestShareholdersResponse:
      description: 最新股東結構回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LatestShareholdersEnvelope"
    TopShareholdersResponse:
      description: 股東持倉回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopShareholdersEnvelope"
    ShareholderDetailResponse:
      description: 股東持倉詳情回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ShareholderDetailEnvelope"
    FundHoldingsResponse:
      description: 持股基金回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FundHoldingsEnvelope"
    CorporateActionsResponse:
      description: 公司行動回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CorporateActionsEnvelope"
    NewsResponse:
      description: 個股新聞回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsEnvelope"
    NewsDetailResponse:
      description: 新聞詳情回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsDetailEnvelope"
    NewsErrorResponse:
      description: 錯誤回應。常見 HTTP 狀態包括 400（參數錯誤）、401（驗證失敗）、403（權限或配額限制）、404（無符合條件的數據）、429（請求頻率限制）及 503（服務暫不可用）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsErrorEnvelope"
    CalendarResponse:
      description: 財報日曆回應。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalendarEnvelope"
    ErrorResponse:
      description: 錯誤回應。常見 HTTP 狀態包括 400（參數錯誤）、401（驗證失敗）、403（權限或配額限制）、404（無符合條件的數據）、429（請求頻率限制）及 503（服務暫不可用）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missingAPIKey:
              summary: 缺少 API Key
              value:
                code: "1002"
                message: API key is required. Provide via X-API-Key header
                error: "1002"
            missingKind:
              summary: 缺少必填參數
              value:
                code: 40001
                message: kind is required
                data: null
            endpointForbidden:
              summary: API Key 無權存取此介面
              value:
                code: 3009
                message: This endpoint is not allowed for your API key
                data: null
            marketForbidden:
              summary: API Key 未開放該市場
              value:
                code: 3010
                message: Fundamentals market not allowed for your API key
                data:
                  market: US
            noAvailableSource:
              summary: 數據暫不可用
              value:
                code: 5003
                message: Data is temporarily unavailable
                data: null
            notFound:
              summary: 無符合條件的數據
              value:
                code: 40404
                message: shareholder detail not found
                data: null
            businessNoData:
              summary: 查詢條件沒有有效業務數據
              value:
                code: 40405
                message: valuation time series not found
                data: null
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - code
        - data
      properties:
        code:
          type: integer
          const: 0
          description: 業務狀態碼，成功為 `0`。
    APIKeyStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              description: 響應消息。
            data:
              $ref: "#/components/schemas/APIKeyStatusData"
    APIKeyStatusData:
      type: object
      required:
        - server_time
        - total
        - api_keys
      properties:
        server_time:
          type: string
          format: date-time
          description: 本次查詢的伺服器時間，包含時區的日期時間字串。
        total:
          type: integer
          minimum: 0
          description: 返回的 API Key 數量。
        api_keys:
          type: array
          description: 帳戶名下的 API Key 列表。
          items:
            $ref: "#/components/schemas/APIKeyStatusItem"
      additionalProperties: false
    APIKeyStatusItem:
      type: object
      required:
        - key_prefix
        - name
        - plan
        - status
        - expires_at
        - remaining_seconds
        - created_at
      properties:
        key_prefix:
          type: string
          description: API Key 前綴，用於辨認 Key；不是完整密鑰。
        name:
          type: string
          description: API Key 名稱。
        plan:
          type: string
          description: 該 Key 對應的方案識別碼。
        status:
          type: string
          enum:
            - active
            - expired
            - suspended
            - revoked
          description: Key 狀態：`active`（有效）、`expired`（已過期）、`suspended`（已暫停）、`revoked`（已撤銷）。
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 到期時間；未設定到期時間時為 `null`。
        remaining_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: 距離到期的剩餘秒數；已到期時為 `0`，未設定到期時間時為 `null`。
        created_at:
          type: string
          format: date-time
          description: API Key 建立時間。
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: TickDB API 業務錯誤碼；可能是整數或字串，客戶端應先轉為字串再比較。
          oneOf:
            - type: integer
            - type: string
        message:
          type: string
          description: 錯誤說明。
        error:
          type: string
          description: 相容錯誤標識；僅部分錯誤回應返回。
        data:
          description: 可選的錯誤上下文；可能是 null、物件或陣列。
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: true
            - type: array
              items: {}
    ProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ProfileData"
    ProfileData:
      type: object
      description: 公司資料數據。
      required:
        - symbol
        - market
        - name
      properties:
        symbol:
          type: string
          description: 標準化股票代碼。
        name:
          type: string
          description: 展示名稱。
        company_name:
          type: string
          description: 公司全稱。
        market:
          type: string
          description: 所屬市場。
        region:
          type: string
          description: 所屬地區。
        founded:
          type:
            - string
            - "null"
          description: 成立年份或日期；無數據時為 null。
        listing_date:
          type:
            - string
            - "null"
          format: date
          description: 上市日期，格式 `YYYY-MM-DD`；可能為 `null`。
        year_end:
          type:
            - string
            - "null"
          description: 財年結束信息；可能為 null。
        address:
          type: string
          description: 地址。
        office_address:
          type: string
          description: 辦公地址。
        phone:
          type: string
          description: 聯系電話。
        email:
          type: string
          description: 電子郵箱。
        website:
          type: string
          description: 公司網站。
        employees:
          type: integer
          description: 員工人數。
        chairman:
          type: string
          description: 董事長。
        manager:
          type: string
          description: 主要管理人員。
        secretary:
          type: string
          description: 公司秘書。
        legal_repr:
          type: string
          description: 法定代表人。
        accounting_firm:
          type: string
          description: 會計師事務所。
        legal_counsel:
          type: string
          description: 法律顧問。
        category:
          type: string
          description: 公司類別。
        profile:
          type: string
          description: 公司業務簡介。
      additionalProperties: false
    ExecutivesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExecutivesData"
    ExecutivesData:
      type: object
      description: 高管／董事數據。
      required:
        - symbol
        - total
        - members
      properties:
        symbol:
          type: string
          description: 股票代碼。
        total:
          type: integer
          minimum: 0
          description: 人員總數。
        members:
          type: array
          description: 高管、董事及關鍵人員列表。
          items:
            $ref: "#/components/schemas/Executive"
      additionalProperties: true
    Executive:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 姓名。
        title:
          type: string
          description: 職務。
        biography:
          type: string
          description: 人物簡介。
      additionalProperties: true
    FinancialRowsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FinancialRowsData"
    FinancialRowsData:
      type: object
      description: 財務報表數據。數值欄位以字串返回，以免產生 JSON 浮點精度問題。
      required:
        - symbol
        - kind
        - rows
      properties:
        symbol:
          type: string
          description: 股票代碼。
        kind:
          type: string
          enum:
            - IS
            - BS
            - CF
          description: 報表類型：`IS` 利潤表、`BS` 資產負債表、`CF` 現金流量表。
        rows:
          type: array
          description: 所選報表類型的指標記錄；同一報告期通常包含多條記錄。
          items:
            $ref: "#/components/schemas/FinancialRow"
      additionalProperties: true
    FinancialRow:
      type: object
      required:
        - kind
        - period_type
        - fiscal_year
        - fiscal_period
        - period_end
        - field_name
        - indicator_title
        - value
      properties:
        kind:
          type: string
          enum:
            - IS
            - BS
            - CF
          description: 報表類型：`IS` 利潤表、`BS` 資產負債表、`CF` 現金流量表。
        field_name:
          type: string
          description: 財務欄位代碼；[查看財務欄位字典](./financial_fields_dictionary)。
        indicator_title:
          type: string
          description: 指標標題。
        field_display:
          type: string
          description: 展示名稱。
        value:
          oneOf:
            - type: string
            - type: number
            - type: "null"
          description: 欄位數值，以字符串返回。
        fiscal_year:
          type: integer
          description: 財年。
        fiscal_period:
          type: string
          description: 報告期。
        period_type:
          type: string
