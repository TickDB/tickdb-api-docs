            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        description: 按股票代碼分組的復權因子對象
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            required:
                              - timestamp
                              - adjust
                              - factor_a
                              - factor_b
                            properties:
                              timestamp:
                                type: integer
                                format: int64
                                description: 因子生效時間戳，單位為毫秒
                              adjust:
                                type: string
                                enum:
                                  - forward
                                  - backward
                                description: 復權方向：`forward` 為前復權，`backward` 為後復權
                              factor_a:
                                type: number
                                description: 復權計算中的乘法因子
                              factor_b:
                                type: number
                                description: 復權計算中的加法因子
        "400":
          description: 請求成功。
        "503":
          description: 請求成功。
