        data:
          type: array
          items:
            $ref: "#/components/schemas/FullMarketTicker"
x-user-api-scope:
  primary_user_api_count: 25
  authentication: X-API-Key
x-fundamentals-product-scope:
  supported_stock_categories:
    - market: US
      exchanges:
        - NASDAQ
        - NYSE
        - AMEX
      category: stock
    - market: HK
      exchanges:
        - HKEX
      category: stock
    - market: CN
      exchanges:
        - SH
        - SZ
      category: stock
  unsupported_upstream_categories:
    - US_ARCA
    - US_BATS
    - CN_BJ_STOCK
    - CN_SH_ETF
    - CN_SZ_ETF
  unsupported_behavior: 不承诺 fundamentals 数据可用性；当前接口行为包括结构化 404 或格式正确的成功空响应。
paths:
  /v1/apikeys/subscriptions:
    get:
      tags:
        - account
      summary: APIKey管理
      description: 無需登入官網，即可查詢 API Key 的到期情況，方便定時檢查和設定提醒。
      operationId: getAPIKeyStatus
      responses:
        "200":
          $ref: "#/components/responses/APIKeyStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/market/ticker:
    get:
      summary: 行情快照
      description: 獲取一個或多個交易品種的實時市場行情數據。
      parameters:
        - name: symbols
          in: query
          required: true
          description: 交易產品代碼，多個用逗號分隔，最多50個
          schema:
            type: string
            default: 700.HK,AAPL.US
            example: 700.HK,AAPL.US
        - name: type
          in: query
          required: false
          description: 產品類型，可選。代碼無歧義時無需傳遞；若返回 `AMBIGUOUS_SYMBOL` 錯誤，按提示傳入對應值即可。可選值：`stock`、`indices`、`crypto`、`forex`、`futures`
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
      responses:
        "200":
          description: 請求成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - symbol
                        - last_price
                        - timestamp
                      additionalProperties: false
                      properties:
                        symbol:
                          type: string
                          description: 交易產品
                        name:
                          type: string
                          description: 產品名稱；名稱信息可用時返回
                        type:
                          type: string
                          enum:
                            - stock
                            - indices
                            - crypto
                            - forex
                            - futures
                          description: 產品類型；產品類型成功識別時返回
                        category:
                          type: string
                          description: A股產品細分類別，例如 `sh_stock`、`sz_stock`、`bj_stock`、`etf`、`cn_bond`、`cn_index`；僅查詢A股市場產品且分類信息可用時返回
                        last_price:
                          type: string
                          description: 最新成交價
                        open:
                          type: string
                          description: 開盤價；行情統計可用時返回。傳統市場通常為當日或當前交易時段開盤價，加密貨幣按對應行情統計窗口返回
                        prev_close:
                          type: string
                          description: 昨收或參考價；行情統計可用時返回。傳統市場通常為上一交易日或上一交易時段收盤價，加密貨幣按對應行情統計窗口返回
                        bid_price:
                          type: string
                          description: 最優買價；盤口報價可用時返回
                        ask_price:
                          type: string
                          description: 最優賣價；盤口報價可用時返回
                        volume_24h:
                          type: string
                          description: 累計成交量；數據可用時返回。加密貨幣通常為滾動24小時成交量，傳統市場通常為當日或當前交易時段成交量
                        quote_volume_24h:
                          type: string
                          description: 與 `volume_24h` 相同統計窗口的成交額；成交額數據可用時返回
                        high_24h:
                          type: string
                          description: 最高價；數據可用時返回，統計窗口與 `volume_24h` 一致
                        low_24h:
                          type: string
                          description: 最低價；數據可用時返回，統計窗口與 `volume_24h` 一致
                        price_change_24h:
                          type: string
