  /v1/market/trade-days:
    get:
      summary: 交易日曆
      description: 查詢指定市場在特定時間範圍內的交易日列表，用於判斷某日是否為交易日。
      parameters:
        - name: market
          in: query
          required: true
          description: 市場代碼，可選值：`US`、`HK`、`CN`
          schema:
            type: string
            enum:
              - US
              - HK
              - CN
            default: US
            example: US
        - name: beg_day
          in: query
          required: true
          description: 開始日期，格式：YYYYMMDD，必須在最近一年範圍內
          schema:
            type: string
            pattern: ^[0-9]{8}$
            default: "20260201"
            example: "20260201"
        - name: end_day
          in: query
          required: true
          description: 結束日期，格式：YYYYMMDD；與開始日期的範圍最多為 31 天
          schema:
            type: string
            pattern: ^[0-9]{8}$
            default: "20260228"
            example: "20260228"
      responses:
        "200":
          description: 請求成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - data
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    const: 0
                    example: 0
                  data:
                    type: object
                    required:
                      - market
                      - trade_days
                      - half_trade_days
                    additionalProperties: false
                    properties:
                      market:
                        type: string
                        enum:
                          - US
                          - HK
                          - CN
                      trade_days:
                        type: array
                        items:
                          type: string
                      half_trade_days:
                        type: array
                        items:
                          type: string
                    example:
                      market: US
                      trade_days:
                        - "20260202"
                        - "20260203"
                        - "20260204"
                        - "20260205"
                        - "20260206"
                        - "20260209"
                        - "20260210"
                        - "20260211"
                        - "20260212"
                        - "20260213"
                        - "20260217"
                        - "20260218"
                        - "20260219"
                        - "20260220"
                        - "20260223"
                        - "20260224"
                        - "20260225"
                        - "20260226"
                        - "20260227"
                      half_trade_days: []
