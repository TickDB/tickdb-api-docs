  /v1/market/kline:
    get:
      summary: K 線查詢
      description: 按週期和時間範圍查詢 K 線數據。
      parameters:
        - name: symbol
          in: query
          required: true
          description: 交易產品代碼
          schema:
            type: string
            default: 700.HK
            example: 700.HK
        - name: interval
          in: query
          required: true
          description: K線週期，可選值：1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d, 1w, 1M
          schema:
            type: string
            enum:
              - 1m
              - 3m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 1d
              - 1w
              - 1M
            default: 1h
            example: 1h
        - name: limit
          in: query
          required: false
          description: 返回記錄數，默認 100；大於 1000 時按 1000 處理，非正數使用默認值 100
          schema:
            type: integer
            example: 100
        - name: start_time
          in: query
          required: false
          description: 開始時間戳（毫秒）
          schema:
            type: integer
            example: 1703123456789
        - name: end_time
          in: query
          required: false
          description: 結束時間戳（毫秒）
          schema:
            type: integer
            example: 1703209856789
        - name: type
          in: query
          required: false
          description: 產品類型，可選。代碼無歧義時無需傳遞；若返回 `AMBIGUOUS_SYMBOL` 錯誤，按提示傳入對應值即可。可選值：`stock`、`indices`、`crypto`、`forex`、`futures`
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
        - name: adjust
          in: query
          required: false
          description: 復權方式，適用於 A 股、港股和美股。可選值：`none` 不復權、`forward` 前復權、`backward` 後復權；不傳時默認不復權（`none`）
          schema:
            type: string
            enum:
              - none
              - forward
              - backward
            default: none
            example: forward
      responses:
        "200":
          description: 請求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      symbol:
                        type: string
                        example: 700.HK
                      type:
                        type: string
                        enum:
                          - stock
                          - indices
                          - crypto
                          - forex
                          - futures
                      interval:
                        type: string
                        example: 1h
                      adjust:
                        type: string
                        enum:
                          - none
                          - forward
                          - backward
                        description: 實際使用的復權方式：`none`、`forward` 或 `backward`
                        example: none
                      klines:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: integer
                            open:
                              type: string
                            high:
                              type: string
                            low:
                              type: string
                            close:
                              type: string
                            volume:
                              type: string
                            quote_volume:
                              type: string
                              description: 成交額，期貨通常不返回
                            open_interest:
                              type: string
                              description: 持倉量，僅期貨返回
                        example:
                          - time: 1773291600000
                            open: "545.5"
                            high: "546.5"
                            low: "541.5"
                            close: "543.5"
                            volume: "1549300"
                            quote_volume: "842560983.33"
