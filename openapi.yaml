      properties:
        symbol:
          type: string
          description: 交易产品代码。
        name:
          type: string
          description: 产品名称；名称信息可用时返回。
        type:
          type: string
          enum:
            - stock
            - indices
          description: 产品类型。
        category:
          type: string
          enum:
            - sh_stock
            - sz_stock
            - bj_stock
            - etf
            - cn_index
            - cn_bond
          description: A股产品细分类别；仅A股全量行情返回。
        last_price:
          type: string
          description: 最新成交价。
        open:
          type: string
          description: 当日开盘价；数据不可用时不返回。
        prev_close:
          type: string
          description: 上一交易日收盘价；数据不可用时不返回。
        volume_24h:
          type: string
          description: 当日累计成交量；数据不可用时不返回。
        quote_volume_24h:
          type: string
          description: 当日累计成交额；数据不可用时不返回。
        high_24h:
          type: string
          description: 当日最高价；数据不可用时不返回。
        low_24h:
          type: string
          description: 当日最低价；数据不可用时不返回。
        price_change_24h:
          type: string
          description: 相对昨收的价格变化；数据不可用时不返回。
        price_change_percent_24h:
          type: string
          description: 相对昨收的价格变化百分比；数据不可用时不返回。
        timestamp:
          type: integer
          format: int64
          description: Unix 时间戳，单位为毫秒。
    FullMarketTickerResponse:
      type: object
      required:
        - code
        - message
        - data
      additionalProperties: false
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/FullMarketTicker"
x-user-api-scope:
  primary_user_api_count: 25
  authentication: X-API-Key
x-fundamentals-product-scope:
  supported_stock_categories:
    - market: US
      exchanges:
        - NASDAQ
        - NYSE
        - AMEX
      category: stock
    - market: HK
      exchanges:
        - HKEX
      category: stock
    - market: CN
      exchanges:
        - SH
        - SZ
      category: stock
  unsupported_upstream_categories:
    - US_ARCA
    - US_BATS
    - CN_BJ_STOCK
    - CN_SH_ETF
    - CN_SZ_ETF
  unsupported_behavior: 不承诺 fundamentals 数据可用性；当前接口行为包括结构化 404 或格式正确的成功空响应。
paths:
  /v1/apikeys/subscriptions:
    get:
      tags:
        - account
      summary: APIKey管理
      description: 无需登录官网，即可查询 API Key 的到期情况，便于定时检查和设置提醒。
      operationId: getAPIKeyStatus
      responses:
        "200":
          $ref: "#/components/responses/APIKeyStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/market/ticker:
    get:
      summary: 行情快照
      description: 获取一个或多个交易品种的实时市场行情数据。
      parameters:
        - name: symbols
          in: query
          required: true
          description: 交易产品代码，多个用逗号分隔，最多50个
          schema:
            type: string
            default: 700.HK,AAPL.US
            example: 700.HK,AAPL.US
        - name: type
          in: query
          required: false
          description: 产品类型，可选。代码无歧义时无需传递；若返回 `AMBIGUOUS_SYMBOL` 错误，按提示传入对应值即可。可选值：`stock`、`indices`、`crypto`、`forex`、`futures`
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
              - futures
            example: stock
      responses:
        "200":
          description: 请求成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - symbol
                        - last_price
                        - timestamp
                      additionalProperties: false
                      properties:
                        symbol:
                          type: string
                          description: 标准化交易产品代码。
                        name:
                          type: string
                          description: 产品名称；名称信息可用时返回。
                        type:
                          type: string
                          enum:
                            - stock
                            - indices
                            - crypto
                            - forex
                            - futures
                          description: 产品类型；产品类型成功识别时返回。
                        category:
                          type: string
                          description: A股产品细分类别，例如 sh_stock、sz_stock、bj_stock、etf、cn_bond、cn_index；仅查询A股市场产品且分类信息可用时返回。
                        last_price:
                          type: string
                          description: 最新成交价。
                        open:
                          type: string
                          description: 开盘价；相应行情统计可用时返回。传统市场通常为当日或当前交易时段开盘价，加密货币按对应行情统计窗口返回。
                        prev_close:
                          type: string
                          description: 昨收或参考价；相应行情统计可用时返回。传统市场通常为上一交易日或上一交易时段收盘价，加密货币按对应行情统计窗口返回。
                        bid_price:
                          type: string
                          description: 最优买价；盘口报价可用时返回。
                        ask_price:
                          type: string
                          description: 最优卖价；盘口报价可用时返回。
                        volume_24h:
                          type: string
                          description: 累计成交量；相应行情统计可用时返回。加密货币通常为滚动24小时成交量，传统市场通常为当日或当前交易时段成交量。
                        quote_volume_24h:
                          type: string
                          description: 与 volume_24h 相同统计窗口的成交额；成交额数据可用时返回。
                        high_24h:
                          type: string
                          description: 最高价；相应行情统计可用时返回。统计窗口与 volume_24h 一致。
                        low_24h:
                          type: string
                          description: 最低价；相应行情统计可用时返回。统计窗口与 volume_24h 一致。
                        price_change_24h:
                          type: string
                          description: 价格变化；相应行情统计可用时返回。统计窗口与 volume_24h 一致。
                        price_change_percent_24h:
                          type: string
                          description: 价格变化百分比；相应行情统计可用时返回，非空数值保留两位小数。
                        timestamp:
                          type: integer
                          format: int64
                          description: Unix 时间戳，单位为毫秒。
                        pre_market_quote:
                          type: object
                          description: 盘前行情；仅支持扩展交易时段的产品（如美股）且盘前行情数据可用时返回。
                          required:
                            - last_done
                            - timestamp
                            - volume
                            - high
                            - low
                            - prev_close
                          additionalProperties: false
                          properties:
                            last_done:
                              type: string
                              description: 盘前最新成交价。
                            timestamp:
                              type: integer
                              format: int64
                              description: 盘前行情时间戳，Unix 毫秒（UTC）。
                            volume:
                              type: integer
                              format: int64
                              description: 盘前成交量。
                            quote_volume:
                              type: string
                              description: 盘前成交额；数据可用时返回。
                            high:
                              type: string
                              description: 盘前最高价。
                            low:
                              type: string
                              description: 盘前最低价。
                            prev_close:
                              type: string
                              description: 盘前参考昨收价。
                        post_market_quote:
                          type: object
                          description: 盘后行情；仅支持扩展交易时段的产品（如美股）且盘后行情数据可用时返回。
                          required:
                            - last_done
                            - timestamp
                            - volume
                            - high
                            - low
                            - prev_close
                          additionalProperties: false
                          properties:
                            last_done:
                              type: string
                              description: 盘后最新成交价。
                            timestamp:
