  /v1/market/trade-days:
    get:
      summary: 交易日历
      description: 查询指定市场在特定时间范围内的交易日列表，用于判断某日是否为交易日。
      parameters:
        - name: market
          in: query
          required: true
          description: 市场代码，可选值：`US`、`HK`、`CN`
          schema:
            type: string
            enum:
              - US
              - HK
              - CN
            default: US
            example: US
        - name: beg_day
          in: query
          required: true
          description: 开始日期，格式：YYYYMMDD，必须在最近一年范围内
          schema:
            type: string
            pattern: ^[0-9]{8}$
            default: "20260201"
            example: "20260201"
        - name: end_day
          in: query
          required: true
          description: 结束日期，格式：YYYYMMDD；与开始日期的范围最多为 31 天
          schema:
            type: string
            pattern: ^[0-9]{8}$
            default: "20260228"
            example: "20260228"
      responses:
        "200":
          description: 请求成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - data
                additionalProperties: false
                properties:
                  code:
                    type: integer
                    const: 0
                    example: 0
                  data:
                    type: object
                    required:
                      - market
                      - trade_days
                      - half_trade_days
                    additionalProperties: false
                    properties:
                      market:
                        type: string
                        enum:
                          - US
                          - HK
                          - CN
                      trade_days:
                        type: array
                        items:
                          type: string
                      half_trade_days:
                        type: array
                        items:
                          type: string
                    example:
                      market: US
                      trade_days:
                        - "20260202"
                        - "20260203"
                        - "20260204"
                        - "20260205"
                        - "20260206"
                        - "20260209"
                        - "20260210"
                        - "20260211"
                        - "20260212"
                        - "20260213"
                        - "20260217"
                        - "20260218"
                        - "20260219"
                        - "20260220"
                        - "20260223"
                        - "20260224"
                        - "20260225"
                        - "20260226"
                        - "20260227"
                      half_trade_days: []
  /v1/market/stock-info:
    get:
      summary: 股票信息
      description: 获取股票名称、交易所、币种、股本和每股指标等基础信息。
      parameters:
        - name: symbols
          in: query
          required: true
          description: 股票代码，多个用逗号分隔，最多 500 个
          schema:
            type: string
            default: 700.HK,AAPL.US,000001.SZ
            example: 700.HK,AAPL.US,000001.SZ
        - name: type
          in: query
          required: false
          description: 产品类型，可选。代码无歧义时无需传递；若返回 `AMBIGUOUS_SYMBOL` 错误，按提示传入对应值即可。可选值：`stock`、`indices`、`crypto`、`forex`
          schema:
            type: string
            enum:
              - stock
              - indices
              - crypto
              - forex
            example: stock
      responses:
        "200":
          description: 请求成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - symbol
                        - name_cn
                        - exchange
                        - currency
                        - lot_size
                      additionalProperties: false
                      properties:
                        symbol:
                          type: string
                          description: 交易产品
                        name_cn:
                          type: string
                          description: 中文简体标的名称
                        name_en:
                          type: string
                          description: 英文标的名称；港股、美股返回
                        name_hk:
                          type: string
                          description: 中文繁体标的名称；港股、美股返回
                        exchange:
                          type: string
                          description: 标的所属交易所
                        currency:
                          type: string
                          description: 交易币种（CNY/USD/HKD）
                        lot_size:
                          type: integer
                          description: 每手股数
                        total_shares:
                          type: integer
                          description: 总股本；数据可用时返回
                        circulating_shares:
                          type: integer
                          description: 流通股本；数据可用时返回
                        hk_shares:
                          type: integer
                          description: H股股本；港股及同时发行H股的A股公司返回
                        eps:
                          type: string
                          description: 每股收益；数据可用时返回
                        eps_ttm:
                          type: string
                          description: 最近十二个月每股收益；港股、美股数据可用时返回
                        bps:
                          type: string
                          description: 每股净资产；数据可用时返回
                        dividend_yield:
                          type: string
                          description: 股息率；港股、美股数据可用时返回
                        stock_derivatives:
                          type: array
