        - fundamentals-events
      summary: 市场状态
      description: 查询不同市场当前的交易阶段和市场时间。
      operationId: getFundamentalsMarketStatus
      responses:
        "200":
          description: 请求成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - markets
                        properties:
                          markets:
                            type: array
                            items:
                              type: object
                              required:
                                - market
                                - market_time
                                - trade_status
                              properties:
                                market:
                                  type: string
                                  example: US
                                market_time:
                                  type: string
                                  format: date-time
                                trade_status:
                                  type: integer
        default:
          $ref: "#/components/responses/ErrorResponse"
